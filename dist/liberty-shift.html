// ---- src/core/supabase.js
const M_supabase = (() => {
// Il client del server, scritto a mano.
//
// Supabase ha una sua libreria, e non la usiamo: sono 60 KB caricati da un CDN
// per fare quello che qui sotto fanno cinquanta righe di `fetch`. Il file
// unico resta un file unico, l'app resta senza dipendenze, e offline non si
// rompe niente perché non c'è niente da scaricare.
//
// Due regole valgono per tutto il modulo:
//   · nessuna funzione lancia eccezioni. Tornano `{ dati, errore }`, perché la
//     rete che non risponde è un caso normale, non un errore di programmazione;
//   · nessuna funzione conosce la forma dei dati dell'app. Qui c'è il come si
//     parla col server, non cosa gli si dice.

const { SERVER, serverConfigurato } = M_config;

const CHIAVE_SESSIONE = 'liberty-shift:sessione-server';

/**
 * L'identificativo interno di una persona.
 *
 * Supabase Auth vuole un'email e l'app non la chiede: se ne genera una che non
 * esiste e non compare mai nell'interfaccia. Serve a chi gestisce il progetto
 * per trovare la riga giusta quando qualcuno chiede di reimpostare la
 * password.
 *
 * Il dominio è `.internal`, l'estensione riservata proprio agli usi interni:
 * non è instradabile, quindi lì non può arrivare posta nemmeno per sbaglio.
 * Il `.local` scelto all'inizio è stato abbandonato per forza — Supabase lo
 * rifiuta con `email_address_invalid`, e non c'è modo di aggirarlo.
 */
function identificativoInterno(nome, cognome, seme = '') {
  const pulisci = (s) => (s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // via gli accenti
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const coda = seme || Math.random().toString(36).slice(2, 8);
  return `${pulisci(nome)}.${pulisci(cognome)}.${coda}@liberty-shift.internal`;
}

// ------------------------------------------------------------- sessione

function leggiSessione() {
  try {
    return JSON.parse(localStorage.getItem(CHIAVE_SESSIONE) || 'null');
  } catch {
    return null;
  }
}

function scriviSessione(sessione) {
  try {
    if (sessione) localStorage.setItem(CHIAVE_SESSIONE, JSON.stringify(sessione));
    else localStorage.removeItem(CHIAVE_SESSIONE);
  } catch { /* finestra privata: si resta senza sessione, e va bene */ }
}

const sessioneServer = () => leggiSessione();
const collegato = () => Boolean(serverConfigurato() && leggiSessione()?.access_token);

// --------------------------------------------------------------- rete

/**
 * Le Edge Functions vogliono la chiave di generazione nuova, il resto del
 * progetto accetta ancora quella vecchia. Finché la nuova non c'è si usa
 * comunque la vecchia: sul database funziona, sulle funzioni no, e l'errore
 * lo dice.
 */
const chiavePer = (percorso) => (percorso.startsWith('/functions/')
  ? SERVER.chiavePubblicabile || SERVER.chiaveAnon
  : SERVER.chiaveAnon);

const intestazioni = (token, percorso) => ({
  apikey: chiavePer(percorso),
  Authorization: `Bearer ${token || chiavePer(percorso)}`,
  'Content-Type': 'application/json',
});

/**
 * Una chiamata al server, con l'errore già tradotto.
 *
 * Il messaggio di Supabase è in inglese e spesso parla di policy e ruoli: qui
 * dentro diventa una frase che una persona può leggere senza sapere cosa sia
 * una row level security.
 */
async function chiama(percorso, opzioni = {}, { autenticata = true } = {}) {
  if (!serverConfigurato()) return { dati: null, errore: 'Il server non è collegato.' };

  const sessione = leggiSessione();
  if (autenticata && !sessione?.access_token) {
    return { dati: null, errore: 'Sessione scaduta: rientra con la tua password.' };
  }

  let risposta;
  try {
    risposta = await fetch(`${SERVER.url}${percorso}`, {
      ...opzioni,
      headers: {
        ...intestazioni(autenticata ? sessione.access_token : null, percorso),
        ...(opzioni.headers || {}),
      },
    });
  } catch {
    // Nessuna risposta affatto: rete assente, o server irraggiungibile.
    return { dati: null, errore: 'Server irraggiungibile. Riprova quando hai campo.' };
  }

  const testo = await risposta.text();
  const corpo = testo ? sicuroJSON(testo) : null;

  if (!risposta.ok) return { dati: null, errore: traduci(risposta.status, corpo) };
  return { dati: corpo, errore: null };
}

function sicuroJSON(testo) {
  try { return JSON.parse(testo); } catch { return testo; }
}

function traduci(stato, corpo) {
  const grezzo = corpo?.message || corpo?.error_description || corpo?.msg || corpo?.hint || '';
  if (stato === 400 && /invalid login/i.test(grezzo)) return 'Password sbagliata.';
  // Gli errori sollevati dalle nostre funzioni nel database arrivano col loro
  // SQLSTATE e un messaggio già scritto in italiano: quella è la spiegazione
  // giusta, e coprirla con una frase generica manda a cercare un guasto che
  // non c'è. 28000 e P0001 sono i codici delle nostre `raise`.
  if (grezzo && /^(28000|P0001)$/.test(String(corpo?.code || ''))) return grezzo;
  // La chiave della generazione sbagliata: senza questa traduzione l'errore
  // diventa "non hai accesso", e si va a cercare un permesso che non c'entra.
  if (corpo?.code === 'INVALID_API_KEY') {
    return 'Il server non riconosce la chiave dell\'app: manca la chiave pubblicabile.';
  }
  if (stato === 401 || stato === 403) {
    // 401 e 403 qui vogliono dire quasi sempre la stessa cosa: la riga esiste
    // ma non è tua. Dirlo così evita la caccia a un guasto che non c'è.
    return 'Non hai accesso a questo dato. Se è tuo, prova a rientrare.';
  }
  if (stato === 409) return 'Esiste già: probabilmente l\'hai fatto due volte.';
  if (stato >= 500) return 'Il server ha un problema. Riprova fra poco.';
  return grezzo || `Errore ${stato}.`;
}

// --------------------------------------------------------------- auth

/** Entra con identificativo interno e password. */
async function accedi(identificativo, password) {
  const r = await chiama('/auth/v1/token?grant_type=password', {
    method: 'POST',
    body: JSON.stringify({ email: identificativo, password }),
  }, { autenticata: false });
  if (r.errore) return r;
  scriviSessione(r.dati);
  return { dati: r.dati, errore: null };
}

/** Crea l'account. L'identificativo lo genera l'app, non la persona. */
async function registra(identificativo, password) {
  const r = await chiama('/auth/v1/signup', {
    method: 'POST',
    body: JSON.stringify({ email: identificativo, password }),
  }, { autenticata: false });
  if (r.errore) return r;
  // Con la conferma via mail spenta, la registrazione restituisce già una
  // sessione valida; se un giorno venisse riaccesa, qui non ci sarebbe.
  if (r.dati?.access_token) scriviSessione(r.dati);
  return { dati: r.dati, errore: null };
}

/** Rinnova la sessione scaduta. Il token dura un'ora, l'app molto di più. */
async function rinnova() {
  const sessione = leggiSessione();
  if (!sessione?.refresh_token) return { dati: null, errore: 'Nessuna sessione da rinnovare.' };
  const r = await chiama('/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    body: JSON.stringify({ refresh_token: sessione.refresh_token }),
  }, { autenticata: false });
  if (r.errore) {
    scriviSessione(null);
    return r;
  }
  scriviSessione(r.dati);
  return r;
}

function esciDalServer() {
  scriviSessione(null);
}

/** L'id dell'utente collegato, che è anche la chiave della sua riga in `profili`. */
function idUtenteServer() {
  return leggiSessione()?.user?.id || null;
}

// ---------------------------------------------------------------- dati

/**
 * Costruisce la query di PostgREST.
 *
 * `{ eq: { stato: 'APERTA' }, in: { id: [...] }, ordine: 'creata_il.desc' }`
 * diventa `?stato=eq.APERTA&id=in.(...)&order=creata_il.desc`. Sta qui e non
 * sparso nelle chiamate perché una query scritta a mano sbaglia la sintassi
 * una volta su tre, e l'errore arriva come 400 senza spiegazioni.
 */
function query({ eq = {}, in: dentro = {}, contiene = {}, ordine, limite } = {}) {
  const parti = [];
  for (const [campo, valore] of Object.entries(eq)) parti.push(`${campo}=eq.${encodeURIComponent(valore)}`);
  for (const [campo, valori] of Object.entries(dentro)) {
    parti.push(`${campo}=in.(${valori.map((v) => encodeURIComponent(v)).join(',')})`);
  }
  // Per le colonne array: "questo giorno è fra quelli offerti".
  for (const [campo, valore] of Object.entries(contiene)) {
    parti.push(`${campo}=cs.{${encodeURIComponent(valore)}}`);
  }
  if (ordine) parti.push(`order=${ordine}`);
  if (limite) parti.push(`limit=${limite}`);
  return parti.length ? `?${parti.join('&')}` : '';
}

const seleziona = (tabella, opzioni) => chiama(`/rest/v1/${tabella}${query(opzioni)}`);

const inserisci = (tabella, riga) => chiama(`/rest/v1/${tabella}`, {
  method: 'POST',
  headers: { Prefer: 'return=representation' },
  body: JSON.stringify(riga),
});

const aggiorna = (tabella, opzioni, patch) => chiama(`/rest/v1/${tabella}${query(opzioni)}`, {
  method: 'PATCH',
  headers: { Prefer: 'return=representation' },
  body: JSON.stringify(patch),
});

/** Inserisce o sovrascrive: serve alle disponibilità, che hanno chiave doppia. */
const salvaSuChiave = (tabella, riga) => chiama(`/rest/v1/${tabella}`, {
  method: 'POST',
  headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
  body: JSON.stringify(riga),
});

const elimina = (tabella, opzioni) => chiama(`/rest/v1/${tabella}${query(opzioni)}`, {
  method: 'DELETE',
});

/**
 * Chiama una funzione del database.
 *
 * Serve per le cose che il client non può fare da solo perché richiedono un
 * segreto: l'iscrizione, che verifica il codice del negozio dentro il
 * database invece che nel browser, dove sarebbe leggibile da chiunque.
 */
const funzione = (nome, argomenti = {}) => chiama(`/rest/v1/rpc/${nome}`, {
  method: 'POST',
  body: JSON.stringify(argomenti),
});

/** Iscrive chi conosce il codice del negozio, e restituisce il suo profilo. */
async function iscrivi({ codice, nome, cognomeIniziale, contratto, oreSettimanali, genere }) {
  const r = await funzione('iscrivi', {
    codice,
    nome,
    cognome_iniziale: cognomeIniziale,
    contratto,
    ore_settimanali: oreSettimanali,
    genere: genere || 'X',
  });
  // L'errore del database arriva come frase inglese con dentro il messaggio
  // che abbiamo scritto noi: quello che conta è che la persona legga il
  // motivo vero, non "PGRST202".
  if (r.errore && /codice/i.test(r.errore)) return { dati: null, errore: 'Codice del negozio sbagliato.' };
  return r;
}

/**
 * Scarica un calendario sottoscritto passando dal server.
 *
 * Il browser non può farlo da sé: il server di Apple non manda le intestazioni
 * CORS e la chiamata viene rifiutata prima di partire. La funzione `calendario`
 * scarica al posto suo e restituisce il testo, senza salvarlo da nessuna parte.
 */
async function scaricaCalendario(url) {
  // Il nome ha la maiuscola perché così è pubblicata la funzione, e gli
  // indirizzi distinguono le maiuscole: `calendario` risponde 404.
  const r = await chiama('/functions/v1/Calendario', {
    method: 'POST',
    body: JSON.stringify({ url }),
  });
  if (r.errore) return { dati: null, errore: r.errore };
  // La funzione appena creata risponde "Hello": è il codice di esempio che
  // Supabase mette dentro, e che va sostituito. Dirlo per nome evita di
  // cercare il guasto nell'app.
  if (/^Hello/i.test(String(r.dati?.message || ''))) {
    return { dati: null, errore: 'La funzione sul server contiene ancora il codice di esempio.' };
  }
  if (!r.dati?.ics) return { dati: null, errore: r.dati?.errore || 'Risposta vuota dal server.' };
  return { dati: r.dati.ics, errore: null };
}

return { identificativoInterno, sessioneServer, collegato, accedi, registra, rinnova, esciDalServer, idUtenteServer, query, seleziona, inserisci, aggiorna, salvaSuChiave, elimina, funzione, iscrivi, scaricaCalendario };
})();

// ---- src/core/store.js
const M_store = (() => {
// Stato applicativo + persistenza locale.
// Nell'MVP i dati stanno nel browser: sostituire salva()/carica() con
// chiamate a un backend non tocca né il motore né la UI.

const { RULES, PREFERENZE, STATUS } = M_rules;
const { newId, isExpired, hasPriority, isOpen } = M_model;
const { validateRequest, nextStatus, turnoOfferibile } = M_engine;
const { creaCredenziali, verificaPassword, apriSessione, chiudiSessione, sessioneAperta } = M_accesso;
const { monthKey, todayISO } = M_time;
const { seed } = M_seed;
const { serverConfigurato } = M_config;
const {
  accedi, registra, iscrivi, identificativoInterno, idUtenteServer, esciDalServer, collegato,
} = M_supabase;

// La chiave conserva il vecchio nome anche dopo che l'app è diventata Liberty
// Shift: rinominarla sarebbe come cambiare serratura e buttare la chiave, i
// turni e le richieste già inseriti su un telefono sparirebbero.
const CHIAVE = 'cambio-turno:v1';

const store = {
  state: null,
  listeners: new Set(),

  init() {
    this.state = carica() || seed();
    // Dati salvati da una versione precedente possono non avere i campi nuovi.
    this.state.ringraziamenti = this.state.ringraziamenti || [];
    this.state.profilo = this.state.profilo
      || { completato: false, noteAccettateIl: null, versioneNote: null, credenziali: null };
    this.scadenze();
    return this.state;
  },

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },

  commit() {
    this.scadenze();
    salva(this.state);
    this.listeners.forEach((fn) => fn(this.state));
  },

  reset() {
    localStorage.removeItem(CHIAVE);
    this.state = seed();
    this.commit();
  },

  // --- lettura -------------------------------------------------------
  get me() {
    return this.state.users.find((u) => u.id === this.state.currentUserId);
  },
  user(id) {
    return this.state.users.find((u) => u.id === id);
  },
  shift(id) {
    return this.state.shifts.find((s) => s.id === id);
  },
  shiftsById() {
    return Object.fromEntries(this.state.shifts.map((s) => [s.id, s]));
  },
  shiftsOf(userId, { soloFuturi = false } = {}) {
    const oggi = todayISO();
    return this.state.shifts
      .filter((s) => s.userId === userId && (!soloFuturi || s.data >= oggi))
      .sort((a, b) => a.data.localeCompare(b.data));
  },
  /**
   * I turni che posso davvero offrire su una richiesta.
   * Vive qui e non in una schermata perché la stessa risposta serve in tre
   * posti: la riga nel calendario, il dettaglio e la sheet della proposta.
   */
  turniOfferibili(request) {
    const byId = this.shiftsById();
    return this.shiftsOf(this.state.currentUserId, { soloFuturi: true })
      .filter((s) => turnoOfferibile(request, s, this.state.shifts, byId).ok);
  },
  /** Posso rispondere a questa richiesta? Falso anche se è mia o già chiusa. */
  possoRispondere(request) {
    if (!request || request.userId === this.state.currentUserId) return true;
    if (!isOpen(request)) return true;
    return this.turniOfferibili(request).length > 0;
  },
  request(id) {
    return this.state.requests.find((r) => r.id === id);
  },
  bacheca() {
    return this.state.requests
      .filter(isOpen)
      .sort((a, b) => (hasPriority(b) - hasPriority(a)) || b.createdAt.localeCompare(a.createdAt));
  },
  proposteDi(requestId) {
    return this.state.proposals.filter((p) => p.requestId === requestId);
  },
  propostePerMe() {
    const me = this.state.currentUserId;
    return this.state.proposals.filter(
      (p) => (p.daUserId === me || p.aUserId === me) && p.status !== 'RIFIUTATA' && !p.cambioInserito,
    );
  },
  creditoPriorita(userId = this.state.currentUserId) {
    const u = this.user(userId);
    const usati = u.prioritaUsata?.[monthKey(todayISO())] || 0;
    return Math.max(0, RULES.priority.creditsPerMonth - usati);
  },

  // --- scrittura -----------------------------------------------------
  cambiaUtente(id) {
    this.state.currentUserId = id;
    this.commit();
  },

  salvaTurno({ id, data, tipo, start, end, userId = this.state.currentUserId }) {
    const esistente = id
      ? this.shift(id)
      : this.state.shifts.find((s) => s.userId === userId && s.data === data);
    if (esistente) {
      Object.assign(esistente, { data, tipo, start, end });
    } else {
      this.state.shifts.push({ id: newId('sh'), userId, data, tipo, start, end });
    }
    this.commit();
  },

  /**
   * Importa i turni letti da un calendario. Sostituisce quelli già presenti
   * nelle stesse date e lascia stare tutto il resto: un import non deve mai
   * cancellare giorni che il calendario non nomina.
   */
  importaTurni(turni, { userId = this.state.currentUserId } = {}) {
    let aggiornati = 0;
    let aggiunti = 0;
    for (const t of turni) {
      const esistente = this.state.shifts.find((s) => s.userId === userId && s.data === t.data);
      if (esistente) {
        Object.assign(esistente, { tipo: t.tipo, start: t.start, end: t.end });
        aggiornati += 1;
      } else {
        this.state.shifts.push({
          id: newId('sh'), userId, data: t.data, tipo: t.tipo, start: t.start, end: t.end,
        });
        aggiunti += 1;
      }
    }
    this.commit();
    return { aggiunti, aggiornati };
  },

  eliminaTurno(id) {
    const usato = this.state.requests.some((r) => r.cedo.shiftId === id && isOpen(r));
    if (usato) return 'Il turno è collegato a una richiesta aperta: cancella prima la richiesta.';
    this.state.shifts = this.state.shifts.filter((s) => s.id !== id);
    this.commit();
    return null;
  },

  creaRichiesta({ tipo, cedo, cerco, usaPriorita }) {
    const errori = validateRequest(
      { tipo, cedo, cerco, userId: this.state.currentUserId }, this.shiftsById(), this.state.shifts,
    );
    if (errori.length) return { errori };
    if (usaPriorita && this.creditoPriorita() < 1) {
      return { errori: ['Non hai crediti priorità disponibili questo mese.'] };
    }

    const me = this.me;
    const richiesta = {
      id: newId('rq'),
      userId: me.id,
      createdAt: new Date().toISOString(),
      status: STATUS.APERTA,
      prioritaFinoA: null,
      tipo,
      cedo: { shiftId: cedo.shiftId, flessibile: Boolean(cedo.flessibile) },
      cerco: { ...cerco },
    };

    if (usaPriorita) {
      const scadenza = new Date(Date.now() + RULES.priority.durationHours * 3600 * 1000);
      richiesta.prioritaFinoA = scadenza.toISOString();
      const mk = monthKey(todayISO());
      me.prioritaUsata = me.prioritaUsata || {};
      me.prioritaUsata[mk] = (me.prioritaUsata[mk] || 0) + 1;
    }

    this.state.requests.push(richiesta);
    this.commit();
    return { richiesta };
  },

  // Una richiesta pubblicata non si modifica (cap. 23): si cancella e si rifà.
  cancellaRichiesta(id) {
    const r = this.request(id);
    if (!r) return;
    r.status = STATUS.CHIUSA;
    r.chiusaIl = new Date().toISOString();
    this.state.proposals
      .filter((p) => p.requestId === id && p.status !== 'RIFIUTATA')
      .forEach((p) => { p.status = 'RIFIUTATA'; });
    this.commit();
  },

  proponiScambio({ requestId, shiftOffertoId, messaggio }) {
    const r = this.request(requestId);
    if (!r) return { errori: ['Richiesta non trovata.'] };
    const me = this.state.currentUserId;
    if (r.userId === me) return { errori: ['Non puoi proporre uno scambio a te stesso.'] };
    if (this.state.proposals.some((p) => p.requestId === requestId && p.daUserId === me && p.status !== 'RIFIUTATA')) {
      return { errori: ['Hai già una proposta aperta su questa richiesta.'] };
    }
    // Il turno offerto deve reggere davvero: la regola vale qui, non solo nel
    // modulo, così nessuna scorciatoia della UI la aggira.
    const offerto = this.shift(shiftOffertoId);
    if (!offerto || offerto.userId !== me) return { errori: ['Turno offerto non valido.'] };
    const verifica = turnoOfferibile(r, offerto, this.state.shifts, this.shiftsById());
    if (!verifica.ok) return { errori: [verifica.motivo] };

    const proposta = {
      id: newId('pr'),
      requestId,
      daUserId: me,
      aUserId: r.userId,
      shiftOffertoId,
      messaggio: messaggio || '',
      accettataDa: [me], // proporre vale già come prima accettazione
      status: 'IN_ATTESA',
      createdAt: new Date().toISOString(),
      cambioInserito: false,
    };
    this.state.proposals.push(proposta);
    this.aggiornaStato(r);
    this.notifica(r.userId, `${this.user(me).nome} ti ha proposto uno scambio.`);
    this.commit();
    return { proposta };
  },

  accetta(proposalId) {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p || p.status === 'RIFIUTATA') return;
    const me = this.state.currentUserId;
    if (!p.accettataDa.includes(me)) p.accettataDa.push(me);
    const r = this.request(p.requestId);
    if (p.accettataDa.length >= 2) {
      p.status = 'ACCORDO';
      // Le altre proposte sulla stessa richiesta decadono.
      this.state.proposals
        .filter((x) => x.requestId === p.requestId && x.id !== p.id)
        .forEach((x) => { x.status = 'RIFIUTATA'; });
      [p.daUserId, p.aUserId].forEach((u) => this.notifica(u, '🟢 Cambio concordato. Inseriscilo nell\'app ufficiale.'));
    } else {
      this.notifica(p.daUserId === me ? p.aUserId : p.daUserId, `${this.user(me).nome} ha accettato il cambio.`);
    }
    this.aggiornaStato(r);
    this.commit();
  },

  /**
   * Rifiutare con due parole di spiegazione costa poco e cambia molto: chi
   * ha proposto sa se riprovare o lasciar perdere.
   */
  rifiuta(proposalId, motivo = '') {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p) return;
    const me = this.state.currentUserId;
    p.status = 'RIFIUTATA';
    p.motivoRifiuto = motivo.trim();
    p.rifiutataDa = me;
    const altro = p.daUserId === me ? p.aUserId : p.daUserId;
    this.notifica(altro, motivo.trim()
      ? `${this.user(me).nome} ha rifiutato: "${motivo.trim()}"`
      : `${this.user(me).nome} ha rifiutato lo scambio.`);
    this.aggiornaStato(this.request(p.requestId));
    this.commit();
  },

  /**
   * Un grazie è l'unica cosa che resta dopo che il cambio è fatto. Si
   * conserva nel profilo di chi lo riceve.
   */
  ringrazia(proposalId, testo) {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p) return { errori: ['Proposta non trovata.'] };
    const me = this.state.currentUserId;
    const a = p.daUserId === me ? p.aUserId : p.daUserId;
    if (this.state.ringraziamenti.some((r) => r.proposalId === proposalId && r.daUserId === me)) {
      return { errori: ['Hai già ringraziato per questo scambio.'] };
    }
    this.state.ringraziamenti.unshift({
      id: newId('gr'),
      proposalId,
      daUserId: me,
      aUserId: a,
      testo: (testo || '').trim(),
      createdAt: new Date().toISOString(),
    });
    this.notifica(a, `${this.user(me).nome} ti ha ringraziato 💛`);
    this.commit();
    return { ok: true };
  },

  ringraziamentiRicevuti(userId = this.state.currentUserId) {
    return this.state.ringraziamenti.filter((r) => r.aUserId === userId);
  },

  haGiaRingraziato(proposalId) {
    return this.state.ringraziamenti.some(
      (r) => r.proposalId === proposalId && r.daUserId === this.state.currentUserId,
    );
  },

  /**
   * Tutto quello che aspetta una risposta, mia o dell'altra persona.
   * In cima quelle che aspettano me: sono le uniche su cui posso agire.
   */
  inbox() {
    const me = this.state.currentUserId;
    return this.state.proposals
      .filter((p) => (p.daUserId === me || p.aUserId === me) && !p.cambioInserito)
      .map((p) => ({
        proposta: p,
        richiesta: this.request(p.requestId),
        altro: this.user(p.daUserId === me ? p.aUserId : p.daUserId),
        aspettaMe: p.status === 'IN_ATTESA' && !p.accettataDa.includes(me),
        daRingraziare: p.status === 'ACCORDO' && !this.haGiaRingraziato(p.id),
      }))
      .filter((x) => x.richiesta)
      .sort((a, b) => (b.aspettaMe - a.aspettaMe)
        || (b.daRingraziare - a.daRingraziare)
        || b.proposta.createdAt.localeCompare(a.proposta.createdAt));
  },

  // "Cambio inserito": chiude la partita, l'app non tocca il sistema ufficiale.
  cambioInserito(proposalId) {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p) return;
    p.cambioInserito = true;
    const r = this.request(p.requestId);
    if (r) {
      r.status = STATUS.CHIUSA;
      r.chiusaIl = new Date().toISOString();
    }
    this.commit();
  },

  aggiornaStato(request) {
    if (!request) return;
    request.status = nextStatus(request, this.state.proposals);
  },

  impostaDisponibilita(weekKey, slot, valore) {
    const me = this.me;
    me.disponibilita = me.disponibilita || {};
    me.disponibilita[weekKey] = me.disponibilita[weekKey] || Array(7).fill(false);
    me.disponibilita[weekKey][slot] = valore;
    this.commit();
  },

  impostaContratto(patch) {
    Object.assign(this.me, patch);
    this.commit();
  },

  /**
   * Attivare una preferenza spegne la sua opposta: "evito le mattine" e
   * "preferisco le mattine" insieme non vogliono dire niente, e lasciarle
   * entrambe accese scaricherebbe sul motore una contraddizione che si può
   * togliere qui, dove nasce.
   */
  /**
   * Il profilo della persona che usa l'app.
   *
   * Non crea un utente nuovo: riscrive quello corrente. Così i turni e le
   * richieste della demo restano coerenti e l'app è viva dal primo minuto,
   * invece di aprirsi su un calendario vuoto in cui non c'è niente da provare.
   */
  /** Le credenziali di chi usa l'app, senza la password: solo la sua impronta. */
  get credenziali() {
    return this.state.profilo?.credenziali || null;
  },
  entrato() {
    return sessioneAperta(this.credenziali);
  },
  /**
   * Entrare, col server o senza.
   *
   * L'impronta locale resta la prima verifica, e non è una ridondanza: è
   * quello che fa funzionare l'app in magazzino senza campo. Se la password è
   * giusta si entra comunque, e la sessione col server si prende quando la
   * rete torna. Una password sbagliata invece non passa da nessuna delle due
   * parti.
   */
  async entra(password) {
    const localeOk = verificaPassword(password, this.credenziali);

    if (!serverConfigurato()) {
      if (!localeOk) return { errore: 'Password sbagliata.' };
      apriSessione(this.credenziali);
      return { ok: true };
    }

    const identificativo = this.state.profilo?.identificativo;
    if (!identificativo) {
      // Profilo creato prima che il server esistesse: si entra in locale, e
      // sarà l'iscrizione a collegarlo quando la persona la rifarà.
      if (!localeOk) return { errore: 'Password sbagliata.' };
      apriSessione(this.credenziali);
      return { ok: true, soloLocale: true };
    }

    const r = await accedi(identificativo, password);
    if (r.errore) {
      // La rete che manca non è una password sbagliata: distinguerle è la
      // differenza fra "riprova più tardi" e "hai sbagliato a scrivere".
      const rete = /irraggiungibile|Server ha un problema/i.test(r.errore);
      if (rete && localeOk) {
        apriSessione(this.credenziali);
        return { ok: true, offline: true };
      }
      return { errore: rete ? r.errore : 'Password sbagliata.' };
    }
    apriSessione(this.credenziali);
    return { ok: true };
  },
  esci() {
    chiudiSessione();
    esciDalServer();
  },
  /**
   * Cambio password. Serve quella attuale: se qualcuno trova il telefono
   * sbloccato non deve potersi chiudere dentro cambiandola.
   */
  cambiaPassword(attuale, nuova) {
    if (!verificaPassword(attuale, this.credenziali)) {
      return { errore: 'La password attuale non è corretta.' };
    }
    this.state.profilo.credenziali = creaCredenziali(nuova);
    // La sessione segue la credenziale nuova: cambiare password non deve
    // buttare fuori chi l'ha appena cambiata.
    apriSessione(this.state.profilo.credenziali);
    this.commit();
    return { ok: true };
  },

  /**
   * Completa il profilo, e col server collegato iscrive anche al negozio.
   *
   * L'ordine conta: prima l'account, poi l'iscrizione col codice, e solo se
   * entrambe riescono si scrive qualcosa in locale. Al contrario, un codice
   * sbagliato lascerebbe sul telefono un profilo che il server non conosce.
   */
  async iscriviECompleta({ nome, cognome, genere, contratto, oreSettimanali, password, codice, versioneNote }) {
    if (serverConfigurato()) {
      const cog = (cognome || '').trim();
      // Un secondo tentativo dopo un codice sbagliato riusa l'account appena
      // creato: registrarsi di nuovo lascerebbe in giro un account per ogni
      // errore di battitura.
      const giaRegistrato = Boolean(this.state.profilo?.identificativo) && collegato();
      const identificativo = giaRegistrato
        ? this.state.profilo.identificativo
        : identificativoInterno(nome, cognome);

      if (!giaRegistrato) {
        const acc = await registra(identificativo, password);
        if (acc.errore) return { errore: acc.errore };
        // Segnato subito: da qui in poi l'account esiste, e il dispositivo
        // deve saperlo anche se l'iscrizione fallisce un attimo dopo.
        this.state.profilo = { ...(this.state.profilo || {}), identificativo };
        this.commit();
      }

      const isc = await iscrivi({
        codice,
        nome: (nome || '').trim(),
        cognomeIniziale: cog.slice(0, 1).toUpperCase(),
        contratto,
        oreSettimanali: Number(oreSettimanali),
        genere: genere || 'X',
      });
      if (isc.errore) return { errore: isc.errore };

      this.completaProfilo({ nome, cognome, genere, contratto, oreSettimanali, password, versioneNote });
      // L'identificativo lo conserva il dispositivo: la persona non lo sa e
      // non deve saperlo, ma senza non si potrebbe più rientrare.
      this.state.profilo.identificativo = identificativo;
      this.state.profilo.idServer = idUtenteServer();
      this.commit();
      return { ok: true };
    }

    this.completaProfilo({ nome, cognome, genere, contratto, oreSettimanali, password, versioneNote });
    return { ok: true };
  },

  completaProfilo({ nome, cognome, genere, contratto, oreSettimanali, password, versioneNote }) {
    const me = this.me;
    const cog = (cognome || '').trim();
    Object.assign(me, {
      nome: (nome || '').trim() || me.nome,
      // Il cognome intero resta nel profilo; in giro per l'app se ne mostra
      // solo l'iniziale, che in un negozio basta a distinguere due omonimi.
      cognome: cog || me.cognome || '',
      cognomeIniziale: cog.slice(0, 1).toUpperCase() || me.cognomeIniziale,
      genere: genere || 'X',
      contratto: contratto || me.contratto,
      oreSettimanali: Number(oreSettimanali) || me.oreSettimanali,
    });
    const credenziali = password
      ? creaCredenziali(password)
      : this.state.profilo?.credenziali || null;
    this.state.profilo = {
      completato: true,
      noteAccettateIl: new Date().toISOString(),
      versioneNote: versioneNote || this.state.profilo?.versioneNote || null,
      credenziali,
      // Sopravvivono a una modifica del profilo: sono l'aggancio al server,
      // e riscriverli da capo vorrebbe dire un secondo account.
      identificativo: this.state.profilo?.identificativo || null,
      idServer: this.state.profilo?.idServer || null,
    };
    if (credenziali) apriSessione(credenziali);
    this.commit();
    return { ok: true };
  },

  /**
   * L'indirizzo del calendario dei turni, per non farlo ricercare ogni volta.
   *
   * Resta su questo dispositivo e non va sul server: è la chiave che apre il
   * calendario di una persona, e sul server non serve a niente e a nessuno.
   */
  ricordaCalendario(url) {
    this.state.profilo = { ...(this.state.profilo || {}), calendarioUrl: url };
    this.commit();
  },

  /** Il profilo va (ri)fatto se non c'è, o se le note sono cambiate da allora. */
  profiloDaCompletare(versioneNote) {
    const p = this.state.profilo;
    return !p?.completato || p.versioneNote !== versioneNote;
  },

  impostaPreferenze(patch) {
    for (const [key, valore] of Object.entries(patch)) {
      this.me.preferenze[key] = valore;
      const opposta = PREFERENZE.find((p) => p.key === key)?.opposta;
      if (valore && opposta) this.me.preferenze[opposta] = false;
    }
    this.commit();
  },

  /**
   * Segnala la propria richiesta a chi ha una disponibilità compatibile ma
   * non ha pubblicato niente: non c'è una sua richiesta su cui proporre,
   * quindi l'unica cosa onesta è avvisarlo.
   */
  avvisa(userId, requestId) {
    const r = this.request(requestId);
    if (!r) return { errori: ['Richiesta non trovata.'] };
    if (r.avvisati?.includes(userId)) return { errori: ['Hai già avvisato questa persona.'] };
    r.avvisati = [...(r.avvisati || []), userId];
    this.notifica(userId, `${this.me.nome} cerca un cambio che potrebbe interessarti.`);
    this.commit();
    return { ok: true };
  },

  notifica(userId, testo) {
    this.state.notifications.unshift({
      id: newId('nt'), userId, testo, letta: false, createdAt: new Date().toISOString(),
    });
    this.state.notifications = this.state.notifications.slice(0, 100);
  },

  notifichePerMe() {
    return this.state.notifications.filter((n) => n.userId === this.state.currentUserId);
  },

  scadenze() {
    const byId = Object.fromEntries(this.state.shifts.map((s) => [s.id, s]));
    for (const r of this.state.requests) {
      if (isOpen(r) && isExpired(r, byId)) r.status = STATUS.SCADUTA;
    }
  },
};

function salva(state) {
  try {
    localStorage.setItem(CHIAVE, JSON.stringify(state));
  } catch (e) {
    console.warn('Salvataggio non riuscito', e);
  }
}

function carica() {
  try {
    const raw = localStorage.getItem(CHIAVE);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

return { store };
})();

// ---- src/ui/dom.js
const M_dom = (() => {
// Micro-helper di rendering: niente framework, la app è piccola e deve
// restare apribile da Safari senza build.

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/** Template tag: interpola con escaping, salvo valori marcati raw(). */
function html(strings, ...values) {
  return strings.reduce((out, s, i) => {
    if (i === 0) return s;
    const v = values[i - 1];
    const parte = Array.isArray(v)
      ? v.map((x) => (x && x.__raw ? x.value : esc(x))).join('')
      : (v && v.__raw ? v.value : esc(v));
    return out + parte + s;
  }, '');
}

const raw = (value) => ({ __raw: true, value });

function on(root, evento, selettore, handler) {
  root.addEventListener(evento, (e) => {
    const target = e.target.closest(selettore);
    if (target && root.contains(target)) handler(e, target);
  });
}

function toast(testo) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = testo;
  el.classList.add('visibile');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('visibile'), 2600);
}

function sheet(titolo, contenuto, { azioni = '' } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = html`
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${titolo}">
      <div class="sheet-grip"></div>
      <header class="sheet-head">
        <h2>${titolo}</h2>
        <button class="icon-btn" data-chiudi aria-label="Chiudi">✕</button>
      </header>
      <div class="sheet-body">${raw(contenuto)}</div>
      ${raw(azioni ? `<footer class="sheet-foot">${azioni}</footer>` : '')}
    </div>`;
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('aperto'));
  const chiudi = () => {
    wrap.classList.remove('aperto');
    setTimeout(() => wrap.remove(), 220);
  };
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap || e.target.closest('[data-chiudi]')) chiudi();
  });
  return { el: wrap, chiudi };
}

/**
 * Quali riquadri sono aperti.
 *
 * La schermata viene ridisegnata a ogni modifica, e senza memoria un
 * interruttore dentro un <details> lo richiudeva sotto le dita di chi lo
 * aveva appena toccato. Sta qui e non in una vista perché è stato della
 * finestra, non dei dati: non va salvato con il resto.
 */
const riquadriAperti = new Set();

document.addEventListener('toggle', (e) => {
  const chiave = e.target?.dataset?.riquadro;
  if (!chiave) return;
  if (e.target.open) riquadriAperti.add(chiave);
  else riquadriAperti.delete(chiave);
}, true);

return { esc, html, raw, on, toast, sheet, riquadriAperti };
})();

// ---- src/ui/components.js
const M_components = (() => {
const { html, raw, esc } = M_dom;
const { store } = M_store;
const {
  shiftLabel, wantLabel, hasPriority, trasformaTurno, ruoloNelGiorno: ruoloCore,
} = M_model;
const { STATUS_META, TIPO_META, TIPO_CAMBIO } = M_rules;
const { formatDay } = M_time;

function nomeUtente(u) {
  return u ? `${u.nome} ${u.cognomeIniziale}.` : '—';
}

function iniziali(u) {
  return u ? `${u.nome[0]}${u.cognomeIniziale}` : '?';
}

function badgeStato(status) {
  const m = STATUS_META[status] || { dot: '', label: status };
  return html`<span class="badge stato-${status}">${m.dot} ${m.label}</span>`;
}

/** Il blocco della richiesta: è l'unità visiva di tutta l'app. */
function coppiaCedoCerco(request, { compatto = false } = {}) {
  const cedo = store.shift(request.cedo.shiftId);
  const meta = TIPO_META[request.tipo] || TIPO_META.ORARIO;
  const giorni = request.cerco.giorni || [];

  const lato = request.tipo === TIPO_CAMBIO.ORARIO
    ? html`
      <div class="lato cerco">
        <span class="etichetta">🟢 CERCO</span>
        <strong>stesso giorno</strong>
        <span class="orario">${wantLabel(request.cerco)}</span>
      </div>`
    : html`
      <div class="lato cerco">
        <span class="etichetta">🟢 OFFRO</span>
        <strong>${giorni.map((g) => formatDay(g)).join(' o ')}</strong>
        <span class="orario">${wantLabel(request.cerco)}</span>
      </div>`;

  return html`
    <div class="coppia ${compatto ? 'compatta' : ''}">
      <div class="tipo-cambio">${meta.icona} ${meta.label}</div>
      <div class="lati">
        <div class="lato cedo">
          <span class="etichetta">🔴 LASCIO</span>
          <strong>${cedo ? formatDay(cedo.data) : '—'}</strong>
          <span class="orario">${shiftLabel(cedo)}</span>
          ${raw(request.cedo.flessibile ? '<div class="nota">disponibile a lasciare anche altri turni</div>' : '')}
        </div>
        <div class="freccia">⇄</div>
        ${raw(lato)}
      </div>
    </div>`;
}

/** Una riga sola: il minimo per capire se ti riguarda. Il resto è nel dettaglio. */
function sintesiRichiesta(request) {
  const cedo = store.shift(request.cedo.shiftId);
  const giorni = request.cerco.giorni || [];
  if (request.tipo === TIPO_CAMBIO.OFF) {
    return `cerca OFF ${formatDay(cedo?.data)} · offre ${giorni.map((g) => formatDay(g)).join(' o ')}`;
  }
  return `${formatDay(cedo?.data)} · ${shiftLabel(cedo)} → ${wantLabel(request.cerco)}`;
}

/** Il ruolo della richiesta nel giorno guardato, col turno ceduto già risolto. */
function ruoloNelGiorno(request, giorno) {
  const r = ruoloCore(request, giorno, store.shift(request.cedo.shiftId));
  return r.sintesi ? r : { ...r, sintesi: sintesiRichiesta(request) };
}

/**
 * La riga della bacheca. Sta in due righe di testo: nome e una sintesi.
 * Tutto il resto — orari, note, stato, proposte — vive nel dettaglio, che si
 * apre toccandola.
 *
 * Con un `giorno` la sintesi viene riscritta dal punto di vista di quella
 * data: è la differenza fra "questa richiesta esiste" e "questa richiesta ti
 * riguarda oggi".
 */
function cardRichiesta(request, giorno = null) {
  const autore = store.user(request.userId);
  const prio = hasPriority(request);
  const meta = TIPO_META[request.tipo] || TIPO_META.ORARIO;
  const ctx = giorno ? ruoloNelGiorno(request, giorno) : null;
  return html`
    <button class="riga-richiesta ${prio ? 'prioritaria' : ''} ${ctx ? `ruolo-${ctx.ruolo}` : ''}"
            data-act="apri-richiesta" data-id="${request.id}">
      <span class="avatar piccolo">${iniziali(autore)}</span>
      <span class="riga-testo">
        <span class="riga-titolo">
          ${prio ? '⭐ ' : ''}${nomeUtente(autore)}
          <span class="tipo-pill">${ctx ? `${ctx.icona} ${ctx.verbo}` : `${meta.icona} ${meta.breve}`}</span>
        </span>
        <span class="riga-sintesi">${ctx ? ctx.sintesi : sintesiRichiesta(request)}</span>
        ${raw(store.possoRispondere(request) ? '' : '<span class="non-puoi">al momento non puoi cambiare</span>')}
      </span>
      <span class="chevron">›</span>
    </button>`;
}

function cardMatch(match, opzioni = {}) {
  const u = store.user(match.userId);
  const turno = store.shift(match.shiftOffertoId);
  const verde = match.tipo === 'MATCH';
  return html`
    <article class="card match ${verde ? 'verde' : 'giallo'}">
      <header class="card-head">
        <span class="avatar">${iniziali(u)}</span>
        <div>
          <strong>${nomeUtente(u)}</strong>
          <div class="meta">${u?.contratto}</div>
        </div>
        <span class="score">${match.score}%</span>
      </header>
      <div class="match-tipo">
        ${verde ? '🟢 Match' : '🟡 Potenziale'}
        · ${match.origine === 'RICHIESTA' ? 'ha una richiesta compatibile' : 'disponibilità dal profilo'}
      </div>
      <div class="turno-offerto">
        Faresti <strong>${formatDay(turno?.data)}</strong> ·
        <strong>${match.adattato?.trasformato ? `${match.adattato.start}–${match.adattato.end}` : shiftLabel(turno)}</strong>
        ${raw(match.adattato?.trasformato ? `<span class="tag">${shiftLabel(turno)} adattato al tuo contratto</span>` : '')}
      </div>
      ${raw(opzioni.mioCedo
    ? `<div class="turno-ceduto">e ${esc(u?.nome)} prende il tuo <strong>${esc(formatDay(opzioni.mioCedo.data))}</strong> · ${esc(shiftLabel(opzioni.mioCedo))}</div>`
    : '')}
      <ul class="perche">
        ${match.reasons.map((r) => raw(`<li>${r}</li>`))}
      </ul>
      ${raw(match.avvisi.length ? `<div class="avviso">⚠️ ${match.avvisi.join(' ')}</div>` : '')}
      ${raw(azioneMatch(match, opzioni))}
    </article>`;
}

/**
 * Cosa si può fare con un match dipende da come è nato.
 * Chi ha pubblicato una richiesta si può contattare subito; chi ha solo
 * dichiarato una disponibilità va avvisato, perché non c'è una richiesta
 * sua su cui proporre.
 */
function azioneMatch(match, { miaRichiestaId } = {}) {
  const u = store.user(match.userId);
  if (match.requestId) {
    return html`
      <button class="btn primario" data-act="proponi" data-user="${match.userId}"
              data-richiesta="${match.requestId}" data-shift="${match.shiftOffertoId}">
        Proponi lo scambio
      </button>`;
  }
  if (miaRichiestaId) {
    return html`
      <button class="btn secondario" data-act="avvisa" data-user="${match.userId}" data-richiesta="${miaRichiestaId}">
        Avvisa ${u?.nome}
      </button>`;
  }
  return html`
    <button class="btn primario" data-act="pubblica-avvisa" data-user="${match.userId}"
            data-data="${match.data}" data-cambio="${match.cambio}">
      Pubblica e avvisa ${u?.nome}
    </button>`;
}

function vuoto(titolo, sottotitolo, azione = '') {
  return html`
    <div class="vuoto">
      <div class="vuoto-icona">🗓️</div>
      <strong>${titolo}</strong>
      <p>${sottotitolo}</p>
      ${raw(azione)}
    </div>`;
}

/**
 * Una richiesta altrui vista dal lato di chi può risolverla: la percentuale
 * è quanto tu sei una buona risposta per lei, non il contrario.
 */
function cardOpportunita({ richiesta, match }) {
  const u = store.user(richiesta.userId);
  const verde = match.tipo === 'MATCH';
  const mioTurno = store.shift(match.shiftOffertoId);
  // Le due cose che contano: che turno farei io, e che turno farebbe l'altra
  // persona. Ciascuno con le ore del turno che sta lasciando.
  const suoCedo = store.shift(richiesta.cedo.shiftId);
  const perMeT = trasformaTurno(suoCedo, mioTurno);
  const perMe = { data: suoCedo?.data, orario: perMeT.trasformato ? `${perMeT.start}–${perMeT.end}` : shiftLabel(suoCedo) };
  const perLei = match.adattato?.trasformato
    ? `${match.adattato.start}–${match.adattato.end}`
    : shiftLabel(mioTurno);
  return html`
    <article class="card match ${verde ? 'verde' : 'giallo'} ${hasPriority(richiesta) ? 'prioritaria' : ''}">
      <header class="card-head">
        <span class="avatar">${iniziali(u)}</span>
        <div>
          <strong>${hasPriority(richiesta) ? '⭐ ' : ''}${nomeUtente(u)}</strong>
          <div class="meta">${u?.contratto}</div>
        </div>
        <span class="score">${match.score}%</span>
      </header>
      ${raw(coppiaCedoCerco(richiesta, { compatto: true }))}
      ${raw(richiesta.cerco.note ? `<p class="nota-utente">“${esc(richiesta.cerco.note)}”</p>` : '')}
      <div class="scambio-secco">
        <div><span>Tu faresti</span><strong>${formatDay(perMe.data)} · ${perMe.orario}</strong></div>
        <div><span>${u?.nome} farebbe</span><strong>${formatDay(mioTurno?.data)} · ${perLei}</strong></div>
      </div>
      <ul class="perche">${match.reasons.map((r) => raw(`<li>${esc(r)}</li>`))}</ul>
      ${raw(match.avvisi.length ? `<div class="avviso">⚠️ ${esc(match.avvisi.join(' '))}</div>` : '')}
      <button class="btn primario" data-act="proponi" data-user="${richiesta.userId}"
              data-richiesta="${richiesta.id}" data-shift="${match.shiftOffertoId}">
        Proponi lo scambio
      </button>
    </article>`;
}

return { nomeUtente, iniziali, badgeStato, coppiaCedoCerco, sintesiRichiesta, ruoloNelGiorno, cardRichiesta, cardMatch, vuoto, cardOpportunita };
})();

// ----------------------------------------------------------- CALENDARIO

function calendario(params) {
  const mese = params.mese || monthKey(todayISO());
  const [anno, m] = mese.split('-').map(Number);
  const primo = new Date(Date.UTC(anno, m - 1, 1));
  const giorniNelMese = new Date(Date.UTC(anno, m, 0)).getUTCDate();
  // La griglia parte dal sabato: così ogni riga è una settimana Apple intera
  // e il vincolo "non si scambia fra settimane diverse" si vede a colpo d'occhio.
  const offset = slotSettimana(`${anno}-${String(m).padStart(2, '0')}-01`);

  const aperte = store.state.requests.filter(isOpen);
  const perGiorno = new Map();
  for (const r of aperte) {
    const cedo = store.shift(r.cedo.shiftId);
    for (const d of [cedo?.data, ...(r.cerco.giorni || [])]) {
      if (!d) continue;
      const lista = perGiorno.get(d) || [];
      lista.push(r);
      perGiorno.set(d, lista);
    }
  }

  const celle = [];
  for (let i = 0; i < offset; i += 1) celle.push('<div class="giorno vuota"></div>');
  for (let g = 1; g <= giorniNelMese; g += 1) {
    const data = `${anno}-${String(m).padStart(2, '0')}-${String(g).padStart(2, '0')}`;
    const richieste = perGiorno.get(data) || [];
    const mio = store.state.shifts.find((s) => s.userId === store.state.currentUserId && s.data === data);
    const prio = richieste.some(hasPriority);
    // Una barra sotto la cella, non dei pallini: un segmento per ruolo
    // presente quel giorno. Quello che serve sapere guardando il mese è se su
    // quel giorno qualcuno cerca, qualcuno offre, o tutte e due le cose.
    const ruoli = new Set(richieste.map((r) => ruoloNelGiorno(r, data).ruolo));
    const segmenti = ['CERCA', 'OFFRE']
      .filter((k) => ruoli.has(k))
      .map((k) => `<i class="${k.toLowerCase()}"></i>`)
      .join('');
    celle.push(html`
      <button class="giorno ${data === todayISO() ? 'oggi' : ''} ${prio ? 'prioritaria' : ''}"
              data-act="giorno" data-data="${data}">
        <span class="numero">${g}</span>
        <span class="mio-turno">${mio ? (mio.tipo === 'OFF' ? 'OFF' : mio.start.slice(0, 5)) : ''}</span>
        <span class="barre">${raw(segmenti)}</span>
      </button>`);
  }

  const prev = m === 1 ? `${anno - 1}-12` : `${anno}-${String(m - 1).padStart(2, '0')}`;
  const next = m === 12 ? `${anno + 1}-01` : `${anno}-${String(m + 1).padStart(2, '0')}`;

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/calendario?mese=${prev}">‹</button>
      <h1>${MESI[m - 1]} ${anno}</h1>
      <button class="icon-btn" data-act="vai" data-to="#/calendario?mese=${next}">›</button>
      <button class="icon-btn" data-act="guida" data-sezione="calendario" title="Come funziona">?</button>
    </header>
    <div class="griglia-intestazione">
      ${['S', 'D', 'L', 'M', 'M', 'G', 'V'].map((d) => raw(`<span>${d}</span>`))}
    </div>
    <div class="griglia-mese">${celle.map(raw)}</div>
    <p class="legenda">
      <span class="barre in-legenda"><i class="cerca"></i></span> cercano ·
      <span class="barre in-legenda"><i class="offre"></i></span> offrono ·
      bordo oro: priorità. Ogni riga è una settimana Apple, da sabato a venerdì.
    </p>`;
}

/**
 * Due gruppi soli, perché due sono le domande che uno si fa aprendo un
 * giorno: chi vuole liberarsene, e chi mette qualcosa a disposizione.
 * Nel secondo stanno insieme i giorni offerti e i turni di un cambio orario:
 * da fuori sono la stessa cosa, un turno che si può prendere.
 */
const GRUPPI_GIORNO = [
  { ruolo: 'CERCA', titolo: 'Cercano', nota: 'Vogliono questo giorno libero. Se tu sei a casa, puoi prendere il loro turno.' },
  { ruolo: 'OFFRE', titolo: 'Offrono', nota: 'Turni e giornate messi a disposizione: qui si prende.' },
];

function dettaglioGiorno(data) {
  const richieste = store.state.requests.filter((r) => {
    if (!isOpen(r)) return false;
    const cedo = store.shift(r.cedo.shiftId);
    return cedo?.data === data || (r.cerco.giorni || []).includes(data);
  }).sort((a, b) => hasPriority(b) - hasPriority(a));
  const mio = store.state.shifts.find((s) => s.userId === store.state.currentUserId && s.data === data);

  const sezioni = GRUPPI_GIORNO.map((g) => {
    const dentro = richieste.filter((r) => ruoloNelGiorno(r, data).ruolo === g.ruolo);
    if (!dentro.length) return '';
    return html`
      <section class="gruppo-giorno ${g.ruolo}">
        <h3>${g.titolo} · ${dentro.length}</h3>
        <p class="testo-tenue">${g.nota}</p>
        ${raw(dentro.map((r) => cardRichiesta(r, data)).join(''))}
      </section>`;
  }).join('');

  return html`
    <div class="giorno-dettaglio">
      <p class="tuo-turno">
        Il tuo turno: <strong>${mio ? shiftLabel(mio) : 'non inserito'}</strong>
        ${raw(mio && etichettaFascia(mio) ? `<span class="tag">${etichettaFascia(mio)}</span>` : '')}
      </p>
      ${raw(sezioni || '<p class="testo-tenue">Nessuna richiesta su questo giorno.</p>')}
    </div>`;
}

// -------------------------------------------------------------- BACHECA

const FILTRI = {

function profilo() {

function sezionePreferenze(me) {
  const gruppi = [
    {
      key: 'evita',

      nota: 'Filtro netto: questi turni non ti vengono proposti, nemmeno con un punteggio basso.',

  const box = gruppi.map((g) => {

    return html`

  return html`

}

/**
 * Le prossime due settimane Apple, sabato → venerdì. È il posto unico dove
 * si inseriscono i turni e si scopre chi ha bisogno di te: prima erano tre
 * schermate diverse, e la disponibilità era una griglia di ✅ che nessuno
 * avrebbe aggiornato ogni settimana.
 */
function dueSettimane() {
  const me = store.me;
  const oggi = todayISO();
  const prima = appleWeekKey(oggi);

  // Una volta sola per tutta la griglia: il motore è lo stesso che usano i match.
  const opportunita = opportunitaPerMe(me.id, store.state);
  const perGiorno = new Map();
  for (const o of opportunita) {
    for (const g of o.giorni) {
      perGiorno.set(g, [...(perGiorno.get(g) || []), o]);
    }
  }

  return [prima, addDays(prima, 7)].map((wk) => {
    const celle = Array.from({ length: 7 }, (_, i) => {
      const data = addDays(wk, i);
      const turno = store.state.shifts.find((s) => s.userId === me.id && s.data === data);
      const mie = perGiorno.get(data) || [];
      const migliore = mie[0];
      const disponibile = disponibileIl(me, data);
      return html`
        <button class="giorno-due ${data === oggi ? 'oggi' : ''} ${data < oggi ? 'passato' : ''} ${disponibile ? 'disponibile' : ''}"
                data-act="giorno-profilo" data-data="${data}">
          <span class="dow">${GIORNI[weekday(data)]}</span>
          <span class="numero">${toDate(data).getUTCDate()}</span>
          <span class="turno">${turno ? (turno.tipo === 'OFF' ? 'OFF' : turno.start) : '—'}</span>
          ${raw(migliore ? `<span class="quota">${migliore.match.score}%</span>` : '<span class="quota vuota"></span>')}
        </button>`;
    }).join('');

    return html`
      <div class="settimana-due">
        <h3>${formatDay(wk)} → ${formatDay(addDays(wk, 6))}</h3>
        <div class="griglia-due">${raw(celle)}</div>
      </div>`;
  }).join('');
}

/** Il dettaglio di un giorno: il tuo turno, e chi puoi aiutare. */
function dettaglioGiornoProfilo(data) {
  const me = store.me;
  const turno = store.state.shifts.find((s) => s.userId === me.id && s.data === data);
  const disponibile = disponibileIl(me, data);
  const mie = opportunitaPerMe(me.id, store.state).filter((o) => o.giorni.includes(data));
  const tutte = richiesteSulGiorno(me.id, data, store.state);
  const senzaRisposta = tutte.length - mie.length;

  return html`
    <div class="giorno-profilo">
      <button class="riga-turno" data-act="modifica-turno" data-data="${data}">
        <span class="giorno-nome">Il tuo turno</span>
        <span class="turno-valore ${turno?.tipo === 'OFF' ? 'off' : ''}">
          ${turno ? shiftLabel(turno) : '— da inserire'}${raw(etichettaFascia(turno) ? ` <span class="tag">${etichettaFascia(turno)}</span>` : '')}
        </span>
        <span class="chevron">›</span>
      </button>

      <label class="switch">
        <input type="checkbox" data-act="toggle-disp-giorno" data-data="${data}" ${raw(disponibile ? 'checked' : '')}>
        <span>Disponibile a scambiare questo giorno</span>
      </label>
      <p class="testo-tenue">
        Dichiararlo ti fa comparire fra i match potenziali di chi cerca, anche se tu non hai pubblicato niente.
      </p>

      <h3>${mie.length ? `Puoi aiutare ${mie.length === 1 ? 'una persona' : `${mie.length} persone`}` : 'Nessuno da aiutare qui'}</h3>
      ${raw(mie.length
    ? mie.map((o) => cardOpportunita(o)).join('')
    : `<p class="testo-tenue">${tutte.length
      ? `Ci sono ${tutte.length} richieste su questo giorno, ma nessuna che tu possa risolvere con i turni che hai.`
      : 'Nessuna richiesta aperta su questo giorno.'}</p>`)}
      ${raw(mie.length && senzaRisposta > 0
    ? `<p class="testo-tenue">Altre ${senzaRisposta} richieste su questo giorno non tornano con i tuoi turni.</p>`
    : '')}
    </div>`;
}

return { home, calendario, dettaglioGiorno, bacheca, profilo, impostazioni, listaRingraziamenti, dueSettimane, dettaglioGiornoProfilo };

const rapido = { shiftId: null };

/**
 * Un tocco e vedi chi può prenderti il turno. Nessuna domanda: il motore
 * prova sia il cambio orario nella stessa giornata sia il cambio OFF su
 * tutti i giorni in cui sei libero, e mette insieme i risultati.
 */
function vistaRapida() {
  const miei = store.shiftsOf(store.state.currentUserId, { soloFuturi: true })
    .filter((s) => s.tipo === 'WORK');

  if (!miei.length) {
    return html`
      ${raw(testataRapido())}

  }

  if (!rapido.shiftId || !miei.some((s) => s.id === rapido.shiftId)) {
    rapido.shiftId = miei[0].id;
  }
  const cedo = store.shift(rapido.shiftId);
  const risultati = cambioRapido(rapido.shiftId, store.state);
  const orario = risultati.filter((m) => m.cambio === TIPO_CAMBIO.ORARIO);
  const off = risultati.filter((m) => m.cambio === TIPO_CAMBIO.OFF);

  const sceltaTurno = miei.map((s) => html`

  return html`

  ))}

      <button class="btn secondario largo" data-act="vai" data-to="#/nuovo">Nuovo cambio</button>` : '')}`;
}

    : 'Scegli il turno di cui vuoi cambiare l\'orario. Resti nello stesso giorno.'}</p>
    ${raw(miei.length ? `<div class="lista-turni">${righe}</div>`
    : vuoto('Nessun turno inserito', 'Aggiungi prima i tuoi turni.', '<button class="btn primario" data-act="vai" data-to="#/profilo">Inserisci i turni dal Profilo</button>'))}
    ${raw(off ? `
      <label class="switch">
        <input type="checkbox" data-act="flessibile" ${draft.flessibile ? 'checked' : ''}>

    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="1">Indietro</button>
      <button class="btn primario" data-act="step" data-step="3" ${raw(draft.cedoShiftId ? '' : 'disabled')}>Continua</button>
    </div>`;
}

function passoCerco() {
  return draft.tipo === TIPO_CAMBIO.OFF ? passoCercoOff() : passoCercoOrario();
}

/** Cambio orario: si resta nel giorno, si sceglie solo l'orario. */
function passoCercoOrario() {
  const cedo = store.shift(draft.cedoShiftId);
  draft.cerco.giorni = [cedo.data];

  const modi = [
    [WANT_MODE.RANGE, 'Una fascia'],
    [WANT_MODE.SPECIFIC, 'Un orario preciso'],
  ].map(([k, label]) => html`
    <button class="chip ${draft.cerco.mode === k ? 'attivo' : ''}" data-act="modo" data-modo="${k}">${label}</button>`).join('');

  const campi = draft.cerco.mode === WANT_MODE.SPECIFIC
    ? campiOrarioPreciso(cedo.data)
    : html`
      <div class="campi-orario">
        <label>Che finisca entro <input type="time" data-campo="entroLe" value="${draft.cerco.entroLe}"></label>
        <label>Che inizi dopo <input type="time" data-campo="dalleOre" value="${draft.cerco.dalleOre}"></label>
      </div>
      <p class="testo-tenue">Basta uno dei due. È il modo in cui scrivete già in chat: "un turno che finisca prima delle 19".</p>`;

  return html`
    ${raw(barra('Che orario cerchi?', 2))}
    <div class="card riepilogo">
      <p><strong>${formatDay(cedo.data, true)}</strong> · lasci ${shiftLabel(cedo)}</p>
    </div>
    <div class="chips">${raw(modi)}</div>
    ${raw(campi)}
    <label class="switch">
      <input type="checkbox" data-act="evita-chiusura" ${raw(draft.cerco.evitaChiusura ? 'checked' : '')}>
      <span>Non voglio un turno di chiusura</span>
    </label>
    <label class="campo">
      <span>Messaggio (facoltativo)</span>
      <textarea data-campo="note" rows="2" placeholder="Es. ho la macchina dal meccanico">${draft.cerco.note}</textarea>
    </label>
    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="2">Indietro</button>
      <button class="btn primario" data-act="step" data-step="4">Continua</button>
    </div>`;
}

/** Cambio OFF: si scelgono i giorni in cui si è disposti a lavorare. */
function passoCercoOff() {
  const cedo = store.shift(draft.cedoShiftId);
  const liberi = giorniLiberi(store.state.currentUserId, cedo.data, store.state.shifts);

  const pillole = liberi.map((g) => html`
    <button class="pill ${draft.cerco.giorni.includes(g) ? 'attivo' : ''}" data-act="giorno-off" data-data="${g}">
      ${formatDay(g)}
      <em>${draft.cerco.giorni.includes(g) ? 'scelto' : 'sei a casa'}</em>
    </button>`).join('');

  const modi = [
    [WANT_MODE.ANY, 'Qualsiasi turno'],
    [WANT_MODE.RANGE, 'Una fascia'],
  ].map(([k, label]) => html`
    <button class="chip ${draft.cerco.mode === k ? 'attivo' : ''}" data-act="modo" data-modo="${k}">${label}</button>`).join('');

  return html`
    ${raw(barra('Cosa offri in cambio?', 2))}
    <div class="card riepilogo">
      <p>Vuoi libero <strong>${formatDay(cedo.data, true)}</strong>, dove hai ${shiftLabel(cedo)}.</p>
    </div>
    ${raw(liberi.length ? `
      <p class="testo-tenue">Offri i giorni liberi in cui saresti disposto a lavorare. Più ne offri, più è probabile trovare qualcuno.</p>
      <div class="pillole">${pillole}</div>`
    : vuoto('Nessun giorno libero', `Quella settimana lavori tutti i giorni: senza un OFF da offrire non c'è niente da scambiare. Prova un cambio orario.`))}

    ${raw(draft.cerco.giorni.length ? `
      <h3>Il turno che prenderesti</h3>
      <div class="chips">${modi}</div>
      ${draft.cerco.mode === WANT_MODE.RANGE ? `
        <div class="campi-orario">
          <label>Che finisca entro <input type="time" data-campo="entroLe" value="${draft.cerco.entroLe}"></label>
          <label>Che inizi dopo <input type="time" data-campo="dalleOre" value="${draft.cerco.dalleOre}"></label>
        </div>` : ''}
      <label class="switch">
        <input type="checkbox" data-act="evita-chiusura" ${draft.cerco.evitaChiusura ? 'checked' : ''}>
        <span>Non voglio un turno di chiusura</span>
      </label>` : '')}

    <label class="campo">
      <span>Messaggio (facoltativo)</span>

    </label>
    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="2">Indietro</button>
      <button class="btn primario" data-act="step" data-step="4" ${raw(draft.cerco.giorni.length ? '' : 'disabled')}>Continua</button>

/**
 * L'orario preciso non si digita: si sceglie fra i turni che quel giorno
 * esistono davvero in store. Digitare a mano è la trappola per chi ha un
 * contratto diverso: un Part Time che copia "11:00–20:00" dal turno di un
 * Full Time sta chiedendo ore che non farebbe mai.
 */
function campiOrarioPreciso(giorno) {
  const mioCedo = store.shift(draft.cedoShiftId);
  const visti = new Set();
  const turni = store.state.shifts
    .filter((s) => s.data === giorno && s.tipo === 'WORK' && s.userId !== store.state.currentUserId)
    .filter((s) => {
      const chiave = `${s.start}-${s.end}`;
      if (visti.has(chiave)) return false;
      visti.add(chiave);
      return true;
    })
    .sort((a, b) => a.start.localeCompare(b.start));

  const righe = turni.map((s) => {
    const t = trasformaTurno(s, mioCedo);
    const scelto = draft.cerco.start === t.start && draft.cerco.end === t.end;
    return html`
      <button class="riga-turno ${scelto ? 'scelto' : ''}" data-act="scegli-orario"
              data-start="${t.start}" data-end="${t.end}">
        <span class="giorno-nome">${shiftLabel(s)}${raw(etichettaFascia(s) ? ` <span class="tag">${etichettaFascia(s)}</span>` : '')}</span>
        <span class="turno-valore">${t.trasformato ? `tu faresti ${t.start}–${t.end}` : 'stesso orario per te'}</span>
        <span class="chevron">${scelto ? '✓' : '›'}</span>
      </button>`;
  }).join('');

  return html`
    ${raw(turni.length ? `
      <p class="testo-tenue">Gli altri turni di quel giorno. L'orario a destra è quello che faresti tu, con il tuo contratto.</p>
      <div class="lista-turni">${righe}</div>` : '')}
    <label class="switch">
      <input type="checkbox" data-act="orario-manuale" ${raw(draft.orarioManuale ? 'checked' : '')}>
      <span>Nessuno di questi, scrivo io l'orario</span>
    </label>
    ${raw(draft.orarioManuale || !turni.length ? `
      <div class="campi-orario">
        <label>Dalle <input type="time" data-campo="start" value="${draft.cerco.start}"></label>
        <label>Alle <input type="time" data-campo="end" value="${draft.cerco.end}"></label>
      </div>
      <p class="testo-tenue">Scrivi le ore che faresti tu, non quelle del turno di chi te lo cede.</p>` : '')}`;
}

function passoRiepilogo() {
  const finto = {
    userId: store.state.currentUserId,
    tipo: draft.tipo,
    cedo: { shiftId: draft.cedoShiftId, flessibile: draft.flessibile },
    cerco: draft.cerco,
  };
  const credito = store.creditoPriorita();

  return html`
    ${raw(barra('Controlla e pubblica', 3))}
    <div class="card">
      ${raw(coppiaCedoCerco(finto))}

    </div>

    <label class="switch ${credito < 1 ? 'disabilitato' : ''}">
      <input type="checkbox" data-act="priorita" ${raw(draft.usaPriorita ? 'checked' : '')} ${raw(credito < 1 ? 'disabled' : '')}>
      <span>⭐ Usa la priorità del mese (${credito} disponibile, dura ${RULES.priority.durationHours}h)</span>
    </label>
    <p class="testo-tenue">La priorità non si può aggiungere dopo e non torna indietro se cancelli la richiesta.</p>

    ${raw(errori.length ? `<div class="errori">${errori.map((e) => `<p>⚠️ ${e}</p>`).join('')}</div>` : '')}
    ${raw(draft.errori.length ? `<div class="errori">${draft.errori.map((e) => `<p>⚠️ ${e}</p>`).join('')}</div>` : '')}

    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="3">Indietro</button>
      <button class="btn primario" data-act="pubblica" ${raw(errori.length ? 'disabled' : '')}>Pubblica e cerca match</button>

function barra(titolo, passo) {
  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/home">✕</button>
      <h1>${titolo}</h1>

      <span class="passo">${passo}/3</span>

// ---------------------------------------------------------------- MATCH

function match(params) {
  const r = store.request(params.id);
  if (!r) return vuoto('Richiesta non trovata', 'Forse è stata chiusa.');
  const risultati = findMatches(r, store.state);
  const pieni = risultati.filter((m) => m.tipo === 'MATCH');
  const potenziali = risultati.filter((m) => m.tipo === 'POTENZIALE');

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/home">‹</button>
      <h1>Possibili match</h1>
    </header>
    <div class="card riepilogo">${raw(coppiaCedoCerco(r, { compatto: true }))}</div>

    ${raw(pieni.length ? `<h2 class="titolo-gruppo">🟢 Match (${pieni.length})</h2>${pieni.map((m) => cardMatch(m, { miaRichiestaId: r.id })).join('')}` : '')}
    ${raw(potenziali.length ? `<h2 class="titolo-gruppo">🟡 Potenziali (${potenziali.length})</h2>${potenziali.map((m) => cardMatch(m, { miaRichiestaId: r.id })).join('')}` : '')}
    ${raw(risultati.length ? '' : vuoto(
    'Ancora nessuno',
    'Nessun collega ha pubblicato una richiesta compatibile né dichiarato disponibilità su quel giorno. La richiesta resta in bacheca.',
    '<button class="btn secondario" data-act="vai" data-to="#/bacheca">Vai alla bacheca</button>',
  ))}
    <p class="testo-tenue">Chi non ha dato nessun segnale di interesse non compare: l'app non manda richieste a caso.</p>`;
}

// ---------------------------------------------------- DETTAGLIO RICHIESTA

function dettaglio(params) {
  const r = store.request(params.id);
  if (!r) return vuoto('Richiesta non trovata', 'Forse è stata chiusa o è scaduta.');
  const autore = store.user(r.userId);
  const mio = r.userId === store.state.currentUserId;
  const proposte = store.proposteDi(r.id).filter((p) => p.status !== 'RIFIUTATA');
  const me = store.state.currentUserId;

  const blocchiProposte = proposte.map((p) => {
    const da = store.user(p.daUserId);
    const offerto = store.shift(p.shiftOffertoId);
    const coinvolto = p.daUserId === me || p.aUserId === me;
    const hoAccettato = p.accettataDa.includes(me);
    const accordo = p.status === 'ACCORDO';

    const azioni = accordo
      ? html`
        <div class="accordo">
          <strong>🟢 Scambio concordato</strong>
          <p>Ora effettua il cambio nell'app ufficiale dei turni. Questa app non lo fa al posto tuo.</p>
          ${raw(p.cambioInserito
    ? '<span class="tag">cambio inserito</span>'
    : `<div class="barra-azioni">
        ${store.haGiaRingraziato(p.id) ? '' : `<button class="btn primario" data-act="chiedi-grazie" data-id="${p.id}">💛 Ringrazia</button>`}
        <button class="btn secondario" data-act="cambio-inserito" data-id="${p.id}">Cambio inserito</button>
      </div>`)}
        </div>`
      : coinvolto && !hoAccettato
        ? html`
          <div class="barra-azioni">
            <button class="btn primario" data-act="accetta" data-id="${p.id}">Accetta</button>
            <button class="btn secondario" data-act="chiedi-rifiuto" data-id="${p.id}">Rifiuta</button>
          </div>`
        : html`<p class="testo-tenue">In attesa dell'altra accettazione (${p.accettataDa.length}/2).</p>`;

    return html`
      <article class="card proposta">
        <header class="card-head">
          <span class="avatar">${iniziali(da)}</span>
          <div><strong>${nomeUtente(da)}</strong><div class="meta">ha proposto uno scambio</div></div>
        </header>
        <p>Ti darebbe <strong>${formatDay(offerto?.data)}</strong> · ${shiftLabel(offerto)}</p>
        ${raw(p.messaggio ? `<p class="nota-utente">“${p.messaggio}”</p>` : '')}
        <div class="accettazioni">${raw(p.accettataDa.map((u) => `<span class="tag ok">${nomeUtente(store.user(u))} ha accettato</span>`).join(''))}</div>
        ${raw(azioni)}
      </article>`;
  }).join('');

  const hoGiaProposto = proposte.some((p) => p.daUserId === me);
  const accordoRaggiunto = r.status === STATUS.ACCORDO || r.status === STATUS.CHIUSA;
  const azioneAutore = mio
    ? (accordoRaggiunto ? '' : html`
      <div class="barra-azioni">
        <button class="btn secondario" data-act="vai" data-to="#/match?id=${r.id}">Rivedi i match</button>
        <button class="btn pericolo" data-act="cancella" data-id="${r.id}">Cancella richiesta</button>
      </div>`)
    : r.status === STATUS.ACCORDO || r.status === STATUS.CHIUSA || hoGiaProposto
      ? ''
      : turniOfferibili(r).length
        ? html`<button class="btn primario largo" data-act="proponi" data-user="${r.userId}" data-richiesta="${r.id}" data-shift="">Proponi uno scambio</button>`
        // Il posto dove ci sarebbe stato il pulsante è il posto giusto per
        // dire perché non c'è: prima spariva e basta.
        : html`<p class="non-puoi">al momento non puoi cambiare</p>
          <p class="testo-tenue nota-non-puoi">${motivoNonOfferibile(r)}</p>`;

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="indietro">‹</button>
      <h1>Cambio turno</h1>
    </header>
    <article class="card ${hasPriority(r) ? 'prioritaria' : ''}">
      <header class="card-head">
        <span class="avatar">${iniziali(autore)}</span>
        <div>
          <strong>${hasPriority(r) ? '⭐ ' : ''}${nomeUtente(autore)}</strong>
          <div class="meta">${RULES.contracts[autore.contratto].label}</div>
        </div>
      </header>
      ${raw(coppiaCedoCerco(r))}
      ${raw(r.cerco.note ? `<p class="nota-utente">“${r.cerco.note}”</p>` : '')}
      <div class="meta">${raw(badgeStato(r.status))} · pubblicata ${formatDay(r.createdAt.slice(0, 10))}</div>
    </article>
    ${raw(blocchiProposte)}
    ${raw(azioneAutore)}`;
}

/**
 * Perché non posso rispondere.
 *
 * Scorrere i motivi turno per turno e prendere il primo dava frasi vere ma
 * senza senso, tipo "Lun 07/09 non è fra i giorni che ha offerto" su una
 * richiesta di mercoledì: il primo turno della lista non c'entra niente.
 * Le condizioni sono poche e note (R8), tanto vale guardare quelle.
 */
function motivoNonOfferibile(request) {
  const me = store.state.currentUserId;
  const cedo = store.shift(request.cedo.shiftId);
  const giorni = request.cerco.giorni || [];
  const mioIl = (data) => store.state.shifts.find((s) => s.userId === me && s.data === data);

  if (request.tipo === TIPO_CAMBIO.ORARIO) {
    const mio = mioIl(cedo?.data);
    if (!mio || mio.tipo !== 'WORK') {
      return `${formatDay(cedo?.data)} non lavori: in un cambio orario servono due persone in turno.`;
    }
    return `Il tuo ${shiftLabel(mio)} non rientra in quello che cerca (${wantLabel(request.cerco)}).`;
  }

  // Cambio OFF: le due condizioni sono essere liberi il giorno che vuole
  // lasciare, e lavorare in uno dei giorni che offre.
  const mioNelSuoGiorno = mioIl(cedo?.data);
  if (mioNelSuoGiorno && mioNelSuoGiorno.tipo === 'WORK') {
    return `${formatDay(cedo?.data)} lavori già (${shiftLabel(mioNelSuoGiorno)}): non puoi prendere anche il suo turno.`;
  }
  const lavorati = giorni.filter((g) => mioIl(g)?.tipo === 'WORK');
  if (!lavorati.length) {
    return `Nei giorni che offre (${giorni.map((g) => formatDay(g)).join(', ')}) sei a casa: non hai un turno da dargli in cambio.`;
  }
  return `I tuoi turni in quei giorni non rientrano in quello che cerca (${wantLabel(request.cerco)}).`;
}

/** I turni che posso davvero offrire su una richiesta. Il calcolo sta nello store. */
const turniOfferibili = (request) => store.turniOfferibili(request);

/** Contenuto della sheet "proponi scambio". */
function formProposta(request, shiftSuggerito) {
  // Si può offrire solo qualcosa che soddisfa davvero il CERCO: se cercano
  // un OFF, un turno lavorato non serve a niente.
  const opzioni = turniOfferibili(request);
  const suoCedo = store.shift(request.cedo.shiftId);

  if (!opzioni.length) {
    return html`
      <div class="card">${raw(coppiaCedoCerco(request, { compatto: true }))}</div>
      <p class="avviso">⚠️ Non hai niente da offrire su questo cambio.</p>
      <p class="testo-tenue">${motivoNonOfferibile(request)}</p>`;
  }

  return html`
    <p>Stai proponendo uno scambio a <strong>${nomeUtente(store.user(request.userId))}</strong>.</p>
    <div class="card">${raw(coppiaCedoCerco(request, { compatto: true }))}</div>
    <label class="campo">
      <span>Il turno che offri</span>
      <select class="select" data-campo="shift">
        ${opzioni.map((s) => {
    const t = trasformaTurno(s, suoCedo);
    const etichetta = t.trasformato
      ? `${formatDay(s.data)} · ${shiftLabel(s)} → farebbe ${t.start}–${t.end}`
      : `${formatDay(s.data)} · ${shiftLabel(s)}`;
    return raw(`<option value="${s.id}" ${s.id === shiftSuggerito ? 'selected' : ''}>${etichetta}</option>`);
  })}
      </select>
    </label>
    ${raw(opzioni.some((s) => trasformaTurno(s, suoCedo).trasformato)
    ? `<p class="testo-tenue">Il contratto di ${nomeUtente(store.user(request.userId))} è diverso dal tuo: il turno si adatta, e l'orario dopo la freccia è quello che farebbe davvero.</p>`
    : '')}
    <label class="campo">
      <span>Messaggio (facoltativo)</span>
      <textarea data-campo="messaggio" rows="2" placeholder="Es. per me va bene anche 12–20"></textarea>
    </label>
    <p class="testo-tenue">Proponendo accetti già da parte tua: serve anche l'accettazione dell'altra persona.</p>`;
}

function pubblica() {
  const { errori, richiesta } = store.creaRichiesta({
    tipo: draft.tipo,
    cedo: { shiftId: draft.cedoShiftId, flessibile: draft.flessibile },
    cerco: draft.cerco,
    usaPriorita: draft.usaPriorita,
  });
  if (errori) {
    draft.errori = errori;
    return null;
  }
  // La bozza ha finito il suo lavoro: se si torna qui si riparte da capo,
  // non dal riepilogo di una richiesta già pubblicata.
  resetDraft();
  toast('Richiesta pubblicata');
  return richiesta;
}

// --------------------------------------------------------------- INBOX

/**
 * Le proposte che ti riguardano, in un posto solo. In cima quelle che
 * aspettano te: sono le uniche su cui puoi fare qualcosa adesso.
 */
function inbox() {
  const voci = store.inbox();
  const daFare = voci.filter((v) => v.aspettaMe || v.daRingraziare);
  const resto = voci.filter((v) => !v.aspettaMe && !v.daRingraziare);

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/profilo">‹</button>
      <h1>Proposte ricevute</h1>
    </header>

    ${raw(voci.length ? '' : vuoto(
    'Niente da leggere',
    'Quando qualcuno propone uno scambio sulle tue richieste, o tu ne proponi uno, lo trovi qui.',
    '<button class="btn primario" data-act="vai" data-to="#/bacheca">Vai alla bacheca</button>',
  ))}

    ${raw(daFare.length ? `<h2 class="titolo-gruppo">Aspettano te (${daFare.length})</h2>` : '')}
    ${raw(daFare.map(vocebox).join(''))}

    ${raw(resto.length ? `<h2 class="titolo-gruppo">In corso</h2>${resto.map(vocebox).join('')}` : '')}`;
}

function vocebox(v) {
  const { proposta: p, richiesta: r, altro } = v;
  const offerto = store.shift(p.shiftOffertoId);
  const ioHoProposto = p.daUserId === store.state.currentUserId;

  const azioni = v.aspettaMe
    ? html`
      <div class="barra-azioni">
