<title>Cambio Turno</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cambio Turno">
<style>
/* Cambio Turno — foglio di stile unico, mobile first, iPhone in mente. */

:root {
  color-scheme: light dark;
  --sfondo: #f4f5f7;
  --superficie: #ffffff;
  --superficie-2: #eef0f4;
  --testo: #12161c;
  --testo-tenue: #667085;
  --bordo: #e3e6ec;
  --accento: #0a6cff;
  --accento-tenue: #e8f0ff;
  --rosso: #e0454b;
  --verde: #1f9d55;
  --giallo: #d99b0a;
  --oro: #c8890a;
  --raggio: 16px;
  --ombra: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 18px rgba(16, 24, 40, .06);
  --tab-h: 62px;
}

/* Il tema scuro vale sia quando il sistema lo chiede, sia quando la pagina
   viene aperta in un contenitore che lo dichiara con data-theme. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sfondo: #0b1220;
    --superficie: #141b2b;
    --superficie-2: #1d2637;
    --testo: #eef2f8;
    --testo-tenue: #94a1b8;
    --bordo: #253046;
    --accento: #4d94ff;
    --accento-tenue: #16233c;
    --rosso: #ff6b70;
    --verde: #45c281;
    --giallo: #e8b53c;
    --oro: #e8b53c;
    --ombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}

:root[data-theme="dark"] {
  --sfondo: #0b1220;
  --superficie: #141b2b;
  --superficie-2: #1d2637;
  --testo: #eef2f8;
  --testo-tenue: #94a1b8;
  --bordo: #253046;
  --accento: #4d94ff;
  --accento-tenue: #16233c;
  --rosso: #ff6b70;
  --verde: #45c281;
  --giallo: #e8b53c;
  --oro: #e8b53c;
  --ombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--sfondo);
  color: var(--testo);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: max(env(safe-area-inset-top), 12px) 16px calc(var(--tab-h) + 32px);
}

h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--testo-tenue); margin: 0 0 10px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
p { margin: 8px 0; }

.testo-tenue { color: var(--testo-tenue); font-size: 14px; }
.meta { color: var(--testo-tenue); font-size: 13px; }
.occhiello { color: var(--testo-tenue); font-size: 15px; margin: 4px 0 16px; }
.nota-regola { margin-top: 22px; }

/* -------------------------------------------------- testate e sezioni */

.hero { padding: 18px 0 6px; }
.hero .saluto { color: var(--testo-tenue); margin: 0; font-size: 15px; }
.hero h1 { font-size: 32px; }
.hero .sottotitolo { color: var(--testo-tenue); font-size: 14px; margin: 2px 0 0; }
.hero.compatta { text-align: center; padding-top: 24px; }

.testata { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
.testata h1 { flex: 1; font-size: 22px; text-align: center; }
.testata .icon-btn:only-of-type + h1 { text-align: left; }
.passo { color: var(--testo-tenue); font-size: 13px; min-width: 30px; text-align: right; }

.sezione { margin: 26px 0; }
.sezione-head { display: flex; align-items: baseline; justify-content: space-between; }

/* ------------------------------------------------------------ bottoni */

.btn {
  appearance: none; border: 0; cursor: pointer;
  font: inherit; font-weight: 600;
  padding: 13px 18px; border-radius: 13px;
  background: var(--superficie-2); color: var(--testo);
  transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.primario { background: var(--accento); color: #fff; }
.btn.secondario { background: var(--superficie); border: 1px solid var(--bordo); }
.btn.pericolo { background: transparent; color: var(--rosso); border: 1px solid var(--bordo); }
.btn.largo { display: block; width: 100%; margin-top: 12px; }

.icon-btn {
  appearance: none; border: 0; background: var(--superficie);
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 18px; color: var(--testo); cursor: pointer;
  border: 1px solid var(--bordo);
}
.link-btn { appearance: none; border: 0; background: none; color: var(--accento); font: inherit; cursor: pointer; padding: 0; }
.link { color: var(--accento); font-weight: 600; font-size: 14px; }

.barra-azioni { display: flex; gap: 10px; margin-top: 18px; }
.barra-azioni .btn { flex: 1; }

/* --------------------------------------------------------------- card */

.card {
  background: var(--superficie);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--ombra);
}
.card.richiesta { cursor: pointer; }
.card.prioritaria { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro) inset, var(--ombra); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-head > div { flex: 1; min-width: 0; }
.card-foot { margin-top: 10px; text-align: right; }

.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accento-tenue); color: var(--accento);
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
  flex: 0 0 auto;
}
.avatar.grande { width: 68px; height: 68px; font-size: 22px; margin: 0 auto 10px; }

.score { font-weight: 700; color: var(--accento); font-variant-numeric: tabular-nums; }

.badge { font-size: 12px; color: var(--testo-tenue); }

/* ----------------------------------------------------- coppia CEDO/CERCO */

.coppia {
  background: var(--superficie-2); border-radius: 12px; padding: 12px;
}
.coppia .lati { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.tipo-cambio {
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--testo-tenue); margin-bottom: 10px;
}
.coppia .lato { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.coppia .etichetta { font-size: 11px; letter-spacing: .06em; font-weight: 700; }
.coppia .cedo .etichetta { color: var(--rosso); }
.coppia .cerco .etichetta { color: var(--verde); }
.coppia strong { font-size: 15px; }
.coppia .orario { font-size: 13px; color: var(--testo-tenue); }
.coppia .freccia { align-self: center; color: var(--testo-tenue); font-size: 18px; }
.coppia .nota { font-size: 12px; color: var(--testo-tenue); font-style: italic; }

.nota-utente { font-size: 14px; color: var(--testo-tenue); font-style: italic; margin: 10px 0 0; }

/* -------------------------------------------------------------- righe */

.lista-cambi, .lista-turni { background: var(--superficie); border: 1px solid var(--bordo); border-radius: var(--raggio); overflow: hidden; }
.lista-cambi:empty { display: none; }

.riga-cambio, .riga-turno {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 13px 14px; border: 0; border-bottom: 1px solid var(--bordo);
  background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.riga-cambio:last-child, .riga-turno:last-child { border-bottom: 0; }
.riga-cambio > div, .riga-turno .giorno-nome { flex: 1; }
.riga-turno .turno-valore { color: var(--testo-tenue); font-size: 14px; }
.riga-turno .turno-valore.off { color: var(--accento); }
.riga-turno.scelto { background: var(--accento-tenue); }
.chevron { color: var(--testo-tenue); }

.pallino { width: 9px; height: 9px; border-radius: 50%; background: var(--accento); flex: 0 0 auto; }
.pallino.urgente { background: var(--rosso); box-shadow: 0 0 0 4px color-mix(in srgb, var(--rosso) 22%, transparent); }

/* -------------------------------------------------------------- tile */

.tile {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 16px; border-radius: var(--raggio); border: 1px solid var(--bordo);
  background: var(--superficie); color: inherit; font: inherit; text-align: left;
  cursor: pointer; box-shadow: var(--ombra); margin-bottom: 10px;
}
.tile > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
.tile em { font-style: normal; color: var(--testo-tenue); font-size: 13px; }
.tile-icona { font-size: 24px; }
.tile.cambio-rapido { background: linear-gradient(135deg, var(--accento) 0%, #6b46ff 100%); color: #fff; border: 0; }
.tile.cambio-rapido em, .tile.cambio-rapido .chevron { color: rgba(255, 255, 255, .8); }
.tile.priorita { border-color: var(--oro); }
.tile.scelta { padding: 18px; }
.tile.scelta.rosso { border-left: 4px solid var(--rosso); }
.tile.scelta.verde { border-left: 4px solid var(--verde); }
.tile.scelta.blu { border-left: 4px solid var(--accento); }

/* --------------------------------------------------------- calendario */

.griglia-intestazione, .griglia-mese { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.griglia-mese { grid-auto-rows: minmax(58px, auto); margin-bottom: 4px; }
.griglia-intestazione { color: var(--testo-tenue); font-size: 12px; text-align: center; margin-bottom: 6px; }

.giorno {
  /* min-height invece di aspect-ratio: in griglia l'aspect-ratio può far
     debordare la cella oltre la riga e coprire quello che viene dopo. */
  min-height: 58px; border: 1px solid var(--bordo); border-radius: 10px;
  background: var(--superficie); color: inherit; font: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 5px 2px; gap: 1px; cursor: pointer; position: relative;
}
.giorno.vuota { border: 0; background: none; }
.giorno .numero { font-size: 14px; font-weight: 600; }
.giorno .mio-turno { font-size: 9px; color: var(--testo-tenue); }
.giorno .indicatori { display: flex; align-items: center; gap: 2px; margin-top: auto; }
.giorno.oggi { border-color: var(--accento); background: var(--accento-tenue); }
.giorno small { font-size: 9px; color: var(--testo-tenue); }

.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accento); display: inline-block; }
.dot.prio { background: var(--oro); }
.legenda { font-size: 12px; color: var(--testo-tenue); margin-top: 12px; }

.giorno-dettaglio .tuo-turno { padding-bottom: 8px; border-bottom: 1px solid var(--bordo); }

/* ------------------------------------------------------- chip e pillole */

.chips, .pillole { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
.chip, .pill {
  appearance: none; border: 1px solid var(--bordo); background: var(--superficie);
  color: inherit; font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
}
.chip.attivo, .pill.attivo { background: var(--accento); color: #fff; border-color: var(--accento); }
.pill { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 12px; line-height: 1.2; }
.pill em { font-style: normal; font-size: 11px; opacity: .6; }
.chip[disabled], .pill[disabled] { opacity: .35; cursor: default; }

.tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--superficie-2); color: var(--testo-tenue); }
.tag.ok { background: color-mix(in srgb, var(--verde) 18%, transparent); color: var(--verde); }

/* ------------------------------------------------------------ moduli */

.campo { display: block; margin: 14px 0; }
.campo > span { display: block; font-size: 13px; color: var(--testo-tenue); margin-bottom: 6px; }
input[type="time"], textarea, .select {
  width: 100%; font: inherit; color: inherit;
  background: var(--superficie); border: 1px solid var(--bordo);
  border-radius: 11px; padding: 11px 12px;
}
.campi-orario { display: flex; gap: 10px; margin: 12px 0; }
.campi-orario label { flex: 1; font-size: 13px; color: var(--testo-tenue); }
.campi-orario input { margin-top: 5px; }

.switch { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--bordo); font-size: 15px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accento); }
.switch.disabilitato { opacity: .5; }

.progresso { height: 3px; background: var(--superficie-2); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }
.progresso i { display: block; height: 100%; background: var(--accento); transition: width .2s ease; }

.errori { background: color-mix(in srgb, var(--rosso) 12%, transparent); border-radius: 12px; padding: 10px 14px; margin: 14px 0; font-size: 14px; }
.errori p { margin: 4px 0; }
.avviso { color: var(--giallo); font-size: 14px; }
.avviso-box { background: var(--superficie-2); border-radius: 12px; padding: 10px 12px; }

/* ------------------------------------------------------------- match */

.titolo-gruppo { font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--testo); margin: 22px 0 10px; }
.card.match.verde { border-left: 4px solid var(--verde); }
.card.match.giallo { border-left: 4px solid var(--giallo); }
.match-tipo { font-size: 13px; color: var(--testo-tenue); margin-bottom: 6px; }
.turno-offerto { font-size: 15px; }
.turno-ceduto { font-size: 14px; color: var(--testo-tenue); margin-bottom: 8px; }
.scambio-secco { display: grid; gap: 4px; margin: 10px 0; }
.scambio-secco > div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.scambio-secco span { color: var(--testo-tenue); }
.perche { margin: 0 0 10px; padding-left: 18px; font-size: 13px; color: var(--testo-tenue); }
.perche li { margin: 3px 0; }
.card.match .btn { width: 100%; }

.accordo { background: color-mix(in srgb, var(--verde) 12%, transparent); border-radius: 12px; padding: 12px; margin-top: 10px; }
.accettazioni { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

/* ------------------------------------------------ le tue due settimane */

.settimana-due { margin-bottom: 16px; }
.settimana-due h3 { margin: 0 0 6px; font-size: 13px; color: var(--testo-tenue); font-weight: 600; }
.griglia-due { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.giorno-due {
  appearance: none; border: 1px solid var(--bordo); border-radius: 10px;
  background: var(--superficie); color: inherit; font: inherit; cursor: pointer;
  min-height: 72px; padding: 6px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.giorno-due .dow { font-size: 10px; color: var(--testo-tenue); }
.giorno-due .numero { font-size: 15px; font-weight: 700; line-height: 1.1; }
.giorno-due .turno { font-size: 10px; color: var(--testo-tenue); }
.giorno-due .quota {
  margin-top: auto; font-size: 10px; font-weight: 700;
  color: #fff; background: var(--accento); border-radius: 999px; padding: 1px 5px;
}
.giorno-due .quota.vuota { background: none; min-height: 14px; }
.giorno-due.oggi { border-color: var(--accento); background: var(--accento-tenue); }
.giorno-due.passato { opacity: .45; }
.giorno-due.disponibile { box-shadow: inset 0 -3px 0 var(--verde); }

.giorno-profilo .riga-turno {
  border: 1px solid var(--bordo); border-radius: 12px; background: var(--superficie);
}

/* -------------------------------------------------------------- vuoto */

.vuoto { text-align: center; padding: 34px 20px; color: var(--testo-tenue); }
.vuoto-icona { font-size: 34px; margin-bottom: 8px; }
.vuoto strong { display: block; color: var(--testo); margin-bottom: 4px; }
.elenco { padding-left: 18px; font-size: 15px; }
.elenco li { margin: 6px 0; }

/* ------------------------------------------------------------ tabbar */

#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  padding: 6px 0 max(env(safe-area-inset-bottom), 6px);
  background: color-mix(in srgb, var(--superficie) 88%, transparent);
  backdrop-filter: saturate(160%) blur(18px);
  border-top: 1px solid var(--bordo);
}
#tabbar[hidden] { display: none; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--testo-tenue); font: inherit; font-size: 10px; padding: 4px 12px;
}
.tab.attivo { color: var(--accento); }
.tab-icona { font-size: 20px; line-height: 1; }

/* -------------------------------------------------------------- sheet */

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(8, 12, 20, .45);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity .2s ease;
}
.sheet-backdrop.aperto { opacity: 1; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  background: var(--sfondo); border-radius: 20px 20px 0 0;
  padding: 8px 16px max(env(safe-area-inset-bottom), 16px);
  transform: translateY(16px); transition: transform .22s ease;
}
.sheet-backdrop.aperto .sheet { transform: none; }
.sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--bordo); margin: 4px auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { flex: 1; font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--testo); margin: 0; }
.sheet-foot { position: sticky; bottom: 0; padding-top: 10px; background: var(--sfondo); }

/* -------------------------------------------------------------- toast */

#toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px); transform: translate(-50%, 12px);
  background: var(--testo); color: var(--sfondo);
  padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 60; max-width: 90vw; text-align: center;
}
#toast.visibile { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>

<script type="module">
// ---- src/core/rules.js
const M_rules = (() => {
// Regolamento configurabile.
// Tutti i punti ancora aperti nella specifica (cap. 30) vivono qui dentro,
// così cambiare una regola dello store non richiede di toccare il motore.

const RULES = {
  // Settimana Apple: sabato -> venerdì (0 = domenica ... 6 = sabato)
  weekStartsOn: 6,

  // Orari dello store. Il negozio vende dalle 10 alle 20; prima e dopo si
  // lavora comunque (apertura, pulizia, visual), da qui la fascia più larga.
  store: {
    apre: '10:00',
    chiude: '20:00',
    primoIngresso: '08:00',
    ultimaUscita: '21:00',
  },

  // "Chiusura" e "mattina" si ricavano dagli orari qui sopra: chiude chi
  // resta oltre l'orario di chiusura, è di mattina chi entra entro
  // l'apertura. Nessuna soglia separata da tenere allineata a mano.

  // Tolleranza per i quasi-match sugli orari (minuti).
  nearMissMinutes: 90,

  // Soglie di classificazione del match.
  matchThreshold: 85,     // >= verde
  potentialThreshold: 50, // >= giallo, sotto non viene mostrato

  // Un match nato da una disponibilità di profilo non può mai
  // presentarsi come match pieno: è solo un indizio di interesse.
  availabilityScoreCap: 75,

  // Priorità
  priority: {
    creditsPerMonth: 1,
    durationHours: 48,
    refundOnCancel: false,
    canBeAddedLater: false,
  },

  // Contratti. La durata del turno è una proprietà della persona, non del
  // contratto: un Part Time può essere da 5 o da 6 ore. Il contratto serve
  // solo come etichetta; i numeri stanno sull'utente.
  contracts: {
    FT: { label: 'Full Time' },
    PT: { label: 'Part Time' },
  },
  durateTurnoAmmesse: [5, 6, 9],
  monteOreAmmessi: [20, 25, 30, 40],
  durataTurnoDefault: { FT: 9, PT: 6 },

  adattamentoPenalty: 5,
};

const STATUS = {
  APERTA: 'APERTA',
  PROPOSTA: 'PROPOSTA',
  IN_ATTESA: 'IN_ATTESA',
  ACCORDO: 'ACCORDO',
  CHIUSA: 'CHIUSA',
  SCADUTA: 'SCADUTA',
};

const STATUS_META = {
  APERTA: { dot: '🟡', label: 'Aperta' },
  PROPOSTA: { dot: '🔵', label: 'Proposta ricevuta' },
  IN_ATTESA: { dot: '🟠', label: 'In attesa di accettazione' },
  ACCORDO: { dot: '🟢', label: 'Accordo raggiunto' },
  CHIUSA: { dot: '⚫', label: 'Chiusa' },
  SCADUTA: { dot: '⚫', label: 'Scaduta' },
};

/**
 * I due tipi di cambio che si fanno davvero in store.
 *
 * ORARIO — dentro la stessa giornata. "Cedo mercoledì 12:00-21:00, cerco
 * mercoledì un turno che finisca prima." Entrambi lavorano quel giorno e si
 * scambiano gli orari. È il caso più frequente.
 *
 * OFF — due giornate. "Voglio libero martedì; in cambio lavoro giovedì, che
 * per me è OFF." Chi accetta è OFF martedì e lavora giovedì: le due persone
 * si scambiano i due giorni, e ciascuno prende il turno che l'altro aveva.
 */
const TIPO_CAMBIO = {
  ORARIO: 'ORARIO',
  OFF: 'OFF',
};

const TIPO_META = {
  ORARIO: { icona: '🕐', label: 'Cambio orario', breve: 'orario' },
  OFF: { icona: '📅', label: 'Cambio OFF', breve: 'OFF' },
};

// Quanto sei rigido sul turno che vuoi ricevere.
const WANT_MODE = {
  SPECIFIC: 'SPECIFIC', // 14:00-20:00
  RANGE: 'RANGE',       // che finisca entro le 20:00
  ANY: 'ANY',           // qualsiasi turno
};

return { RULES, STATUS, STATUS_META, TIPO_CAMBIO, TIPO_META, WANT_MODE };
})();

// ---- src/core/time.js
const M_time = (() => {
// Utility su date e orari. Tutto lavora su stringhe 'YYYY-MM-DD' e 'HH:MM'
// per evitare sorprese di fuso orario: qui non serve mai un istante assoluto.

const { RULES } = M_rules;

const GIORNI = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
const GIORNI_LUNGHI = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
  'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

function toDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}

function toISO(date) {
  return date.toISOString().slice(0, 10);
}

function addDays(iso, n) {
  const d = toDate(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return toISO(d);
}

function weekday(iso) {
  return toDate(iso).getUTCDay();
}

function minutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

/**
 * Settimana Apple: sabato -> venerdì.
 * Restituisce la data ISO del sabato che apre la settimana: è la chiave
 * con cui confrontiamo due giorni.
 */
function appleWeekKey(iso) {
  const day = weekday(iso);
  const diff = (day - RULES.weekStartsOn + 7) % 7;
  return addDays(iso, -diff);
}

/** Regola del cap. 18: CEDO e CERCO devono stare nella stessa settimana Apple. */
function sameAppleWeek(isoA, isoB) {
  return appleWeekKey(isoA) === appleWeekKey(isoB);
}

function appleWeekRange(iso) {
  const start = appleWeekKey(iso);
  return { start, end: addDays(start, 6) };
}

function formatDay(iso, long = false) {
  const d = toDate(iso);
  const names = long ? GIORNI_LUNGHI : GIORNI;
  const dd = String(d.getUTCDate()).padStart(2, '0');
  const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
  return long
    ? `${names[d.getUTCDay()]} ${d.getUTCDate()} ${MESI[d.getUTCMonth()]}`
    : `${names[d.getUTCDay()]} ${dd}/${mm}`;
}

function monthKey(iso) {
  return iso.slice(0, 7);
}

function todayISO(now = new Date()) {
  return toISO(new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())));
}

return { GIORNI, GIORNI_LUNGHI, MESI, toDate, toISO, addDays, weekday, minutes, appleWeekKey, sameAppleWeek, appleWeekRange, formatDay, monthKey, todayISO };
})();

// ---- src/core/model.js
const M_model = (() => {
// Data model (Fase 3 della specifica).
// Nessuna classe: oggetti semplici, serializzabili, pronti per qualsiasi backend.

const { RULES, STATUS, WANT_MODE } = M_rules;
const { minutes, todayISO, appleWeekKey } = M_time;

/**
 * User
 * {
 *   id, nome, cognomeIniziale, ruolo, contratto: 'FT'|'PT',
 *   durataTurno: 5|6|9, oreSettimanali: 20|25|30|40, admin: bool,
 *   preferenze: { preferisceMattina, evitaChiusure, disponibileWeekend },
 *   disponibilita: { '<weekKey>': [bool x7 partendo da sabato] },
 *   prioritaUsata: { '<YYYY-MM>': true }
 * }
 *
 * Shift
 * { id, userId, data: 'YYYY-MM-DD', tipo: 'WORK'|'OFF', start, end }
 *
 * Request
 * {
 *   id, userId, createdAt, status, prioritaFinoA: iso-datetime | null,
 *   tipo: 'ORARIO' | 'OFF',
 *   cedo: { shiftId, flessibile: bool },      // il turno che lascio
 *   cerco: {
 *     giorni: ['YYYY-MM-DD'],   // ORARIO: solo il giorno del turno ceduto
 *                               // OFF: i giorni in cui sono disposto a lavorare
 *     mode, start, end, entroLe, dalleOre, evitaChiusura, note
 *   }
 * }
 *
 * Proposal
 * {
 *   id, requestId, daUserId, aUserId, shiftOffertoId, messaggio,
 *   accettataDa: [userId], status, createdAt, cambioInserito: bool
 * }
 */

let counter = 0;
function newId(prefix) {
  counter += 1;
  return `${prefix}_${Date.now().toString(36)}${counter.toString(36)}`;
}

/**
 * Le notti visual scavalcano la mezzanotte: 22:00–06:00 finisce il giorno
 * dopo. Tutti i confronti sull'orario di fine passano di qui, così un turno
 * notturno non risulta mai "corto" o "che finisce presto".
 */
function isNotturno(shift) {
  return shift?.tipo === 'WORK' && minutes(shift.end) <= minutes(shift.start);
}

/** Minuti di fine sulla scala del giorno di inizio (può superare 1440). */
function fineMinuti(shift) {
  return minutes(shift.end) + (isNotturno(shift) ? 1440 : 0);
}

function durataOre(shift) {
  if (!shift || shift.tipo === 'OFF') return 0;
  return (fineMinuti(shift) - minutes(shift.start)) / 60;
}

/** Chiude chi resta oltre l'orario di chiusura del negozio. */
function isClosing(shift) {
  if (shift?.tipo !== 'WORK' || isNotturno(shift)) return false;
  return minutes(shift.end) > minutes(RULES.store.chiude);
}

/** È di mattina chi entra entro l'apertura del negozio. */
function isMorning(shift) {
  if (shift?.tipo !== 'WORK' || isNotturno(shift)) return false;
  return minutes(shift.start) <= minutes(RULES.store.apre);
}

/** Il turno inizia prima dell'apertura: allestimento, pulizia, consegne. */
function isPreApertura(shift) {
  if (shift?.tipo !== 'WORK' || isNotturno(shift)) return false;
  return minutes(shift.start) < minutes(RULES.store.apre);
}

/** Etichetta breve per il tipo di turno, quando c'è qualcosa da dire. */
function etichettaFascia(shift) {
  if (isNotturno(shift)) return 'notte';
  if (isClosing(shift)) return 'chiusura';
  if (isPreApertura(shift)) return 'apertura';
  return null;
}

/** Il turno esce dalla fascia normale dello store senza essere una notte. */
function fuoriFascia(shift) {
  if (shift?.tipo !== 'WORK' || isNotturno(shift)) return false;
  return minutes(shift.start) < minutes(RULES.store.primoIngresso)
    || minutes(shift.end) > minutes(RULES.store.ultimaUscita);
}

function shiftLabel(shift) {
  if (!shift) return '—';
  if (shift.tipo === 'OFF') return 'OFF';
  return isNotturno(shift) ? `${shift.start}–${shift.end} (+1)` : `${shift.start}–${shift.end}`;
}

function wantLabel(cerco) {
  switch (cerco.mode) {
    case WANT_MODE.SPECIFIC:
      return `${cerco.start}–${cerco.end}`;
    case WANT_MODE.RANGE: {
      const parti = [];
      if (cerco.entroLe) parti.push(`che finisca entro le ${cerco.entroLe}`);
      if (cerco.dalleOre) parti.push(`che inizi dopo le ${cerco.dalleOre}`);
      return `qualsiasi turno ${parti.join(' e ')}`.trim();
    }
    default:
      return cerco.evitaChiusura ? 'qualsiasi turno non di chiusura' : 'qualsiasi turno';
  }
}

function contractOf(user) {
  return RULES.contracts[user.contratto] || RULES.contracts.FT;
}

/** Durata standard del turno di una persona: 9 per un FT, 5 o 6 per un PT. */
function durataTurnoDi(user) {
  return user?.durataTurno ?? RULES.durataTurnoDefault[user?.contratto] ?? 9;
}

function etichettaContratto(user) {
  return `${contractOf(user).label} · turni da ${durataTurnoDi(user)}h · ${user?.oreSettimanali ?? '—'}h a settimana`;
}

function hhmm(min) {
  const m = ((min % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
}

/**
 * Adatta un turno al contratto di chi lo riceve (cap. 19).
 *
 * Uno scambio FT/PT è permesso, ma ciascuno resta sul proprio contratto: il
 * turno viene accorciato o allungato alla durata standard di chi lo prende,
 * tenendo fermo un estremo.
 *
 *   - turno che comincia entro l'apertura -> si tiene fermo l'INIZIO
 *     (entri quando entra chi ti passa il turno)
 *   - qualsiasi altro turno -> si tiene ferma la FINE
 *     (esci quando esce chi ti passa il turno)
 *
 * Esempi con FT 9h e PT 6h:
 *   09:00–18:00 ceduto a un PT -> 09:00–15:00   (apertura, ancora l'inizio)
 *   11:00–20:00 ceduto a un PT -> 14:00–20:00   (chiusura, ancora la fine)
 *   11:00–17:00 ceduto a un FT -> 08:00–17:00   (allungato all'indietro)
 *
 * Restituisce sempre il turno che la persona lavorerebbe davvero.
 */
function trasformaTurno(shift, ricevente) {
  if (!shift || shift.tipo === 'OFF' || !ricevente) {
    return { start: shift?.start, end: shift?.end, trasformato: false };
  }

  const durataTarget = durataTurnoDi(ricevente);
  const durataAttuale = durataOre(shift);
  const base = {
    start: shift.start, end: shift.end, durata: durataAttuale, trasformato: false,
  };
  if (Math.abs(durataAttuale - durataTarget) < 0.01) return base;

  // Le notti sono casi particolari: si segnalano, non si accorciano d'ufficio.
  if (isNotturno(shift)) {
    return { ...base, avviso: 'Turno di notte: la durata va concordata a parte.' };
  }

  const ancoraInizio = minutes(shift.start) <= minutes(RULES.store.apre);
  const durataMin = durataTarget * 60;
  let inizio;
  let fine;
  if (ancoraInizio) {
    inizio = minutes(shift.start);
    fine = inizio + durataMin;
  } else {
    fine = minutes(shift.end);
    inizio = fine - durataMin;
  }

  const risultato = {
    start: hhmm(inizio),
    end: hhmm(fine),
    durata: durataTarget,
    trasformato: true,
    ancora: ancoraInizio ? 'inizio' : 'fine',
    originale: `${shift.start}–${shift.end}`,
  };

  // L'adattamento non deve sbordare dalla fascia in cui si può stare in store.
  if (inizio < minutes(RULES.store.primoIngresso) || fine > minutes(RULES.store.ultimaUscita)) {
    risultato.avviso = `Adattato a ${risultato.start}–${risultato.end}, fuori dalla fascia ${RULES.store.primoIngresso}–${RULES.store.ultimaUscita}: da concordare.`;
  }
  return risultato;
}

/** Il turno adattato, nella forma di uno Shift, per darlo in pasto al motore. */
function turnoAdattato(shift, ricevente) {
  const t = trasformaTurno(shift, ricevente);
  if (!t.trasformato) return shift;
  return { ...shift, start: t.start, end: t.end };
}

/** Ore lavorate da una persona in una settimana Apple. */
function oreSettimana(userId, weekKey, shifts) {
  return shifts
    .filter((s) => s.userId === userId && s.tipo === 'WORK' && appleWeekKey(s.data) === weekKey)
    .reduce((tot, s) => tot + durataOre(s), 0);
}

/**
 * Effetto di uno scambio sul monte ore settimanale.
 * Uno scambio fra due turni standard è a somma zero, perché ciascuno riceve
 * un turno già adattato alla propria durata. Il conto cambia soprattutto
 * quando c'è di mezzo un OFF: lì una persona lavora un turno in meno e
 * l'altra uno in più.
 */
function impattoMonteOre(user, cedo, ricevuto, shifts) {
  const weekKey = appleWeekKey(cedo.data);
  const prima = oreSettimana(user.id, weekKey, shifts);
  const dopo = prima - durataOre(cedo) + durataOre(turnoAdattato(ricevuto, user));
  const contratto = user.oreSettimanali;
  const cambia = Math.abs(dopo - prima) > 0.01;
  if (!cambia || !contratto) return { cambia: false, prima, dopo };

  const scarto = dopo - contratto;
  return {
    cambia: true,
    prima,
    dopo,
    scarto,
    avviso: Math.abs(scarto) < 0.01
      ? null
      : `la settimana passa da ${arrotonda(prima)}h a ${arrotonda(dopo)}h, ${scarto > 0 ? '+' : ''}${arrotonda(scarto)}h rispetto alle ${contratto}h di contratto`,
  };
}

function arrotonda(n) {
  return Number(n.toFixed(1)).toString().replace('.', ',');
}

/** La richiesta è scaduta quando i giorni che tocca sono passati (cap. 24). */
function isExpired(request, shiftsById, oggi = todayISO()) {
  const cedo = shiftsById[request.cedo.shiftId];
  if (!cedo) return true;
  if (cedo.data < oggi) return true;
  const giorni = request.cerco?.giorni || [];
  return giorni.length > 0 && giorni.every((g) => g < oggi);
}

function hasPriority(request, now = new Date()) {
  return Boolean(request.prioritaFinoA) && new Date(request.prioritaFinoA) > now;
}

function isOpen(request) {
  return request.status === STATUS.APERTA
    || request.status === STATUS.PROPOSTA
    || request.status === STATUS.IN_ATTESA;
}

return { newId, isNotturno, fineMinuti, durataOre, isClosing, isMorning, isPreApertura, etichettaFascia, fuoriFascia, shiftLabel, wantLabel, contractOf, durataTurnoDi, etichettaContratto, trasformaTurno, turnoAdattato, oreSettimana, impattoMonteOre, isExpired, hasPriority, isOpen };
})();

// ---- src/core/engine.js
const M_engine = (() => {
// Shift Engine (Fase 2 della specifica).
// Definisce matematicamente quando due richieste sono compatibili
// e perché, perché il match senza spiegazione non serve a nessuno.

const { RULES, STATUS, WANT_MODE, TIPO_CAMBIO } = M_rules;
const {
  minutes, sameAppleWeek, formatDay, weekday, appleWeekKey, addDays, todayISO,
} = M_time;
const {
  isClosing, isMorning, isOpen, hasPriority, shiftLabel, wantLabel,
  fineMinuti, trasformaTurno, turnoAdattato, impattoMonteOre,
} = M_model;

const clamp = (n, min = 0, max = 100) => Math.max(min, Math.min(max, n));

/** Fine del turno cercato sulla scala del giorno di inizio, notti comprese. */
function fineCerco(cerco) {
  const fine = minutes(cerco.end);
  return fine <= minutes(cerco.start) ? fine + 1440 : fine;
}

/**
 * Quanto un turno reale soddisfa quello che si sta cercando.
 * Restituisce { score 0-100, reasons: [] }. Score 0 = incompatibile.
 * Il giorno non è nel `cerco`: una richiesta può candidare più giorni.
 */
function satisfies(cerco, shift) {
  const reasons = [];
  if (!shift || shift.tipo !== 'WORK') {
    return { score: 0, reasons: ['non è un turno lavorato'] };
  }

  if (cerco.evitaChiusura && isClosing(shift)) {
    return { score: 0, reasons: ['è un turno di chiusura, escluso dalla richiesta'] };
  }

  let score = 0;
  switch (cerco.mode) {
    case WANT_MODE.SPECIFIC: {
      // Scarto = il più grande dei due scostamenti, confrontato con la
      // tolleranza. Sommarli penalizzava due volte lo stesso spostamento.
      const dStart = Math.abs(minutes(shift.start) - minutes(cerco.start));
      const dEnd = Math.abs(fineMinuti(shift) - fineCerco(cerco));
      const scarto = Math.max(dStart, dEnd);
      if (scarto === 0) {
        score = 100;
        reasons.push(`orario identico a quello cercato (${cerco.start}–${cerco.end})`);
      } else if (scarto <= RULES.nearMissMinutes) {
        score = Math.round(100 - 40 * (scarto / RULES.nearMissMinutes));
        reasons.push(`${scarto} minuti di scarto (${shiftLabel(shift)} contro ${cerco.start}–${cerco.end})`);
      } else {
        score = 0;
        reasons.push('orario troppo lontano da quello richiesto');
      }
      break;
    }
    case WANT_MODE.RANGE: {
      const violazioni = [];
      if (cerco.entroLe && fineMinuti(shift) > minutes(cerco.entroLe)) {
        violazioni.push(fineMinuti(shift) - minutes(cerco.entroLe));
      }
      if (cerco.dalleOre && minutes(shift.start) < minutes(cerco.dalleOre)) {
        violazioni.push(minutes(cerco.dalleOre) - minutes(shift.start));
      }
      if (violazioni.length === 0) {
        score = 100;
        reasons.push(`rientra nella fascia indicata (${wantLabel(cerco)})`);
      } else {
        const sforo = Math.max(...violazioni);
        score = sforo <= RULES.nearMissMinutes
          ? Math.round(70 - 20 * (sforo / RULES.nearMissMinutes))
          : 0;
        if (score > 0) reasons.push(`fuori fascia di ${sforo} minuti, ma vicino`);
        else reasons.push('fuori dalla fascia oraria richiesta');
      }
      break;
    }
    default: {
      score = 100;
      reasons.push('va bene qualsiasi turno');
    }
  }
  return { score: clamp(score), reasons };
}

/** Validazione prima della pubblicazione, diversa per i due tipi di cambio. */
function validateRequest(request, shiftsById, shifts = null) {
  const { tipo, cedo, cerco, userId } = request;
  const errori = [];
  const mio = shiftsById[cedo?.shiftId];

  if (!mio) errori.push('Devi scegliere il turno che vuoi lasciare.');
  if (mio && mio.tipo !== 'WORK') errori.push('Un giorno di OFF non si cede: si cede il turno che vuoi lasciare.');

  const giorni = cerco?.giorni || [];
  if (!giorni.length) {
    errori.push(tipo === TIPO_CAMBIO.ORARIO
      ? 'Manca l\'orario che cerchi.'
      : 'Devi indicare in quale giorno sei disposto a lavorare in cambio.');
  }

  if (mio && tipo === TIPO_CAMBIO.ORARIO) {
    // Cambio orario: si resta dentro la giornata, quindi niente da
    // controllare sulla settimana Apple.
    if (giorni.some((g) => g !== mio.data)) {
      errori.push('Il cambio orario resta nello stesso giorno. Per cambiare giornata serve un cambio OFF.');
    }
    if (cerco.mode === WANT_MODE.ANY) {
      errori.push('In un cambio orario "qualsiasi turno" non dice niente: indica un orario o una fascia.');
    }
  }

  if (mio && tipo === TIPO_CAMBIO.OFF) {
    for (const g of giorni) {
      if (g === mio.data) {
        errori.push('Il giorno che vuoi liberare non può essere anche quello in cui lavoreresti.');
        continue;
      }
      if (!sameAppleWeek(mio.data, g)) {
        errori.push(
          `Settimane Apple diverse: ${formatDay(mio.data)} e ${formatDay(g)} non sono scambiabili. La settimana va da sabato a venerdì.`,
        );
      }
      if (shifts) {
        const suo = shifts.find((s) => s.userId === (userId ?? mio.userId) && s.data === g);
        if (suo && suo.tipo === 'WORK') {
          errori.push(`Il ${formatDay(g)} lavori già (${shiftLabel(suo)}): puoi offrire solo i giorni in cui sei libero.`);
        }
      }
    }
  }

  if (cerco?.mode === WANT_MODE.SPECIFIC && (!cerco.start || !cerco.end)) {
    errori.push('Per un orario preciso servono inizio e fine.');
  }
  if (cerco?.mode === WANT_MODE.RANGE && !cerco.entroLe && !cerco.dalleOre) {
    errori.push('Per una fascia serve almeno un limite orario.');
  }
  return [...new Set(errori)];
}

function indexShifts(shifts) {
  const byUserDate = new Map();
  const byId = {};
  for (const s of shifts) {
    byId[s.id] = s;
    byUserDate.set(`${s.userId}|${s.data}`, s);
  }
  return { byId, get: (userId, data) => byUserDate.get(`${userId}|${data}`) };
}

const nome = (u) => `${u.nome} ${u.cognomeIniziale}.`;
const contrattoDi = (u) => RULES.contracts[u.contratto]?.label || u.contratto;

/**
 * Le frasi che spiegano l'adattamento e l'impatto sul monte ore.
 *
 * Sempre con il nome proprio, mai con "sei" o "per te": la stessa scheda
 * viene letta da chi pubblica la richiesta e da chi può risolverla, e un "tu"
 * giusto da un lato è sbagliato dall'altro.
 */
function verificheIncrociate(coppie, shifts) {
  const reasons = [];
  const avvisi = [];
  let penalita = 0;
  for (const [chi, cede, riceve] of coppie) {
    const t = trasformaTurno(riceve, chi);
    if (t.trasformato) {
      penalita += RULES.adattamentoPenalty;
      reasons.push(`${chi.nome} è ${contrattoDi(chi)}: ${t.originale} diventa ${t.start}–${t.end}`);
    }
    if (t.avviso) avvisi.push(`${nome(chi)}: ${t.avviso}`);
    if (cede) {
      const ore = impattoMonteOre(chi, cede, riceve, shifts);
      if (ore.avviso) avvisi.push(`${nome(chi)}: ${ore.avviso}.`);
    }
  }
  return { reasons, avvisi, penalita };
}

/**
 * Trova i match per una richiesta, secondo il suo tipo.
 * Non mostra mai chi non ha dato alcun segnale di interesse (cap. 10).
 */
function findMatches(request, ctx) {
  return request.tipo === TIPO_CAMBIO.ORARIO
    ? matchOrario(request, ctx)
    : matchOff(request, ctx);
}

/**
 * CAMBIO ORARIO — stesso giorno.
 * Entrambi lavorano quella giornata e si scambiano gli orari. Nessuno deve
 * essere libero: al contrario, serve che l'altro sia in turno.
 */
function matchOrario(request, ctx) {
  const idx = indexShifts(ctx.shifts);
  const autore = ctx.users.find((u) => u.id === request.userId);
  const mioCedo = idx.byId[request.cedo.shiftId];
  if (!mioCedo || !autore) return [];
  const giorno = mioCedo.data;

  const risultati = [];
  for (const u of ctx.users) {
    if (u.id === autore.id) continue;
    const suo = idx.get(u.id, giorno);
    if (!suo || suo.tipo !== 'WORK') continue;
    if (suo.start === mioCedo.start && suo.end === mioCedo.end) continue; // stesso turno

    const perMe = satisfies(request.cerco, turnoAdattato(suo, autore));
    if (perMe.score === 0) continue;

    // Ha chiesto lui stesso un cambio orario quel giorno?
    const suaRichiesta = ctx.requests.find((r) => r.userId === u.id && isOpen(r)
      && r.tipo === TIPO_CAMBIO.ORARIO && idx.byId[r.cedo.shiftId]?.data === giorno);

    let score;
    let origine;
    const reasons = [];
    if (suaRichiesta) {
      const perLui = satisfies(suaRichiesta.cerco, turnoAdattato(mioCedo, u));
      if (perLui.score === 0) continue;
      score = Math.round((perMe.score + perLui.score) / 2);
      origine = 'RICHIESTA';
      reasons.push(`${nome(u)} ha ${shiftLabel(suo)} quel giorno: ${perMe.reasons[0]}`);
      reasons.push(`e cerca ${wantLabel(suaRichiesta.cerco)}: ${shiftLabel(mioCedo)} di ${nome(autore)} ci rientra`);
    } else {
      if (!disponibileIl(u, giorno)) continue;
      if (u.preferenze?.evitaChiusure && isClosing(turnoAdattato(mioCedo, u))) continue;
      score = Math.min(perMe.score, RULES.availabilityScoreCap);
      origine = 'DISPONIBILITA';
      reasons.push(`${nome(u)} ha ${shiftLabel(suo)} quel giorno e si è dichiarato disponibile a scambiare`);
    }

    const v = verificheIncrociate([[autore, mioCedo, suo], [u, suo, mioCedo]], ctx.shifts);
    score = clamp(Math.round(score - v.penalita), 0,
      origine === 'DISPONIBILITA' ? RULES.availabilityScoreCap : 100);
    if (score < RULES.potentialThreshold) continue;

    risultati.push({
      origine,
      tipo: score >= RULES.matchThreshold ? 'MATCH' : 'POTENZIALE',
      cambio: TIPO_CAMBIO.ORARIO,
      score,
      userId: u.id,
      requestId: suaRichiesta?.id || null,
      shiftOffertoId: suo.id,
      data: giorno,
      adattato: trasformaTurno(suo, autore),
      prioritaria: suaRichiesta ? hasPriority(suaRichiesta) : false,
      reasons: [...reasons, ...v.reasons],
      avvisi: v.avvisi,
    });
  }
  return risultati.sort((a, b) => b.score - a.score || (b.prioritaria - a.prioritaria));
}

/**
 * CAMBIO OFF — due giornate.
 * Io voglio libero il giorno che cedo; in cambio lavoro in uno dei giorni in
 * cui sono OFF. Serve qualcuno che quel giorno sia libero e che lavori in uno
 * dei giorni che offro: ci scambiamo le due giornate intere.
 */
function matchOff(request, ctx) {
  const idx = indexShifts(ctx.shifts);
  const autore = ctx.users.find((u) => u.id === request.userId);
  const mioCedo = idx.byId[request.cedo.shiftId];
  if (!mioCedo || !autore) return [];

  const risultati = [];
  const visti = new Set();

  for (const giorno of request.cerco.giorni || []) {
    for (const u of ctx.users) {
      if (u.id === autore.id) continue;

      // Deve essere libero il giorno che voglio lasciare...
      const suoNelMioGiorno = idx.get(u.id, mioCedo.data);
      if (suoNelMioGiorno && suoNelMioGiorno.tipo !== 'OFF') continue;
      // ...e lavorare nel giorno che gli offro.
      const suo = idx.get(u.id, giorno);
      if (!suo || suo.tipo !== 'WORK') continue;

      const perMe = satisfies(request.cerco, turnoAdattato(suo, autore));
      if (perMe.score === 0) continue;

      const suaRichiesta = ctx.requests.find((r) => r.userId === u.id && isOpen(r)
        && r.tipo === TIPO_CAMBIO.OFF
        && idx.byId[r.cedo.shiftId]?.data === giorno
        && (r.cerco.giorni || []).includes(mioCedo.data));

      let score;
      let origine;
      const reasons = [];
      if (suaRichiesta) {
        const perLui = satisfies(suaRichiesta.cerco, turnoAdattato(mioCedo, u));
        if (perLui.score === 0) continue;
        score = Math.round((perMe.score + perLui.score) / 2);
        origine = 'RICHIESTA';
        reasons.push(`${nome(u)} vuole liberare ${formatDay(giorno)} e lavorare ${formatDay(mioCedo.data)}: l'esatto contrario`);
      } else {
        if (!disponibileIl(u, mioCedo.data)) continue;
        if (u.preferenze?.evitaChiusure && isClosing(turnoAdattato(mioCedo, u))) continue;
        score = Math.min(perMe.score, RULES.availabilityScoreCap);
        origine = 'DISPONIBILITA';
        reasons.push(`è libero ${formatDay(mioCedo.data)} e si è dichiarato disponibile a lavorarci`);
      }
      reasons.push(`${nome(autore)} lavorerebbe ${formatDay(giorno)} al posto suo: ${perMe.reasons[0]}`);

      const v = verificheIncrociate([[autore, mioCedo, suo], [u, suo, mioCedo]], ctx.shifts);
      score = clamp(Math.round(score - v.penalita), 0,
        origine === 'DISPONIBILITA' ? RULES.availabilityScoreCap : 100);
      if (score < RULES.potentialThreshold) continue;

      const chiave = `${u.id}|${suo.id}`;
      if (visti.has(chiave)) continue;
      visti.add(chiave);

      risultati.push({
        origine,
        tipo: score >= RULES.matchThreshold ? 'MATCH' : 'POTENZIALE',
        cambio: TIPO_CAMBIO.OFF,
        score,
        userId: u.id,
        requestId: suaRichiesta?.id || null,
        shiftOffertoId: suo.id,
        data: giorno,
        adattato: trasformaTurno(suo, autore),
        prioritaria: suaRichiesta ? hasPriority(suaRichiesta) : false,
        reasons: [...reasons, ...v.reasons],
        avvisi: v.avvisi,
      });
    }
  }
  return risultati.sort((a, b) => b.score - a.score || (b.prioritaria - a.prioritaria));
}

/**
 * Un turno può essere offerto su una richiesta?
 * Il giorno deve tornare (stesso giorno per un cambio orario, uno dei giorni
 * candidati per un cambio OFF), l'orario deve soddisfare quello che chiedono,
 * e su un cambio OFF chi offre dev'essere libero il giorno da liberare.
 */
function turnoOfferibile(request, shift, shifts, shiftsById) {
  const mioCedo = shiftsById[request.cedo.shiftId];
  if (!shift || shift.tipo !== 'WORK' || !mioCedo) return { ok: false, motivo: 'Turno non valido.' };
  if (shift.userId === request.userId) return { ok: false, motivo: 'È un tuo turno.' };

  const giorni = request.cerco.giorni || [];
  if (!giorni.includes(shift.data)) {
    return {
      ok: false,
      motivo: request.tipo === TIPO_CAMBIO.ORARIO
        ? `Il cambio è per ${formatDay(mioCedo.data)}: serve un turno di quel giorno.`
        : `${formatDay(shift.data)} non è fra i giorni che ha offerto.`,
    };
  }

  if (request.tipo === TIPO_CAMBIO.OFF) {
    const mioNelSuoGiorno = shifts.find((x) => x.userId === shift.userId && x.data === mioCedo.data);
    if (mioNelSuoGiorno && mioNelSuoGiorno.tipo !== 'OFF') {
      return { ok: false, motivo: `Il ${formatDay(mioCedo.data)} lavori già: non puoi prendere anche il suo turno.` };
    }
  }

  const s = satisfies(request.cerco, shift);
  if (s.score === 0) return { ok: false, motivo: `Non è quello che cerca: ${s.reasons[0]}.` };
  return { ok: true };
}

/**
 * Il matching al contrario: non "chi può aiutare la mia richiesta", ma
 * "quali richieste degli altri posso risolvere io".
 *
 * Riusa findMatches invece di riscrivere le regole: per ogni richiesta aperta
 * chiede al motore chi va bene, e guarda se in quella lista ci sono io. Con i
 * numeri di uno store costa niente, e non c'è modo che le due direzioni
 * finiscano per rispondere cose diverse.
 */
function opportunitaPerMe(userId, ctx) {
  const byId = Object.fromEntries(ctx.shifts.map((s) => [s.id, s]));
  const risultati = [];
  for (const r of ctx.requests) {
    if (!isOpen(r) || r.userId === userId) continue;
    const mio = findMatches(r, ctx).find((m) => m.userId === userId);
    if (!mio) continue;
    const cedo = byId[r.cedo.shiftId];
    risultati.push({
      richiesta: r,
      match: mio,
      // I giorni su cui questa richiesta ti riguarda: quello che la persona
      // vuole lasciare e quelli in cui è disposta a lavorare.
      giorni: [...new Set([cedo?.data, ...(r.cerco.giorni || [])].filter(Boolean))],
    });
  }
  return risultati.sort((a, b) => b.match.score - a.match.score);
}

/** Quante richieste aperte toccano un giorno, mie escluse. */
function richiesteSulGiorno(userId, giorno, ctx) {
  const byId = Object.fromEntries(ctx.shifts.map((s) => [s.id, s]));
  return ctx.requests.filter((r) => isOpen(r) && r.userId !== userId
    && (byId[r.cedo.shiftId]?.data === giorno || (r.cerco.giorni || []).includes(giorno)));
}

/** I giorni della settimana Apple di un turno in cui la persona è libera. */
function giorniLiberi(userId, dataRiferimento, shifts) {
  const idx = indexShifts(shifts);
  const settimana = appleWeekKey(dataRiferimento);
  const oggi = todayISO();
  const liberi = [];
  for (let i = 0; i < 7; i += 1) {
    const g = addDays(settimana, i);
    if (g === dataRiferimento || g < oggi) continue;
    const s = idx.get(userId, g);
    if (!s || s.tipo === 'OFF') liberi.push(g);
  }
  return liberi;
}

/**
 * Cambio Rapido: dato un tuo turno, chi potrebbe prenderlo.
 * Prova entrambe le strade senza chiedere niente — prima lo scambio di orario
 * nella stessa giornata, poi lo scambio di OFF su tutti i giorni in cui sei
 * libero — e mette insieme i risultati.
 */
function cambioRapido(shiftId, ctx) {
  const idx = indexShifts(ctx.shifts);
  const mioCedo = idx.byId[shiftId];
  if (!mioCedo || mioCedo.tipo !== 'WORK') return [];
  const autore = ctx.users.find((u) => u.id === mioCedo.userId);
  if (!autore) return [];

  const base = {
    userId: autore.id,
    status: STATUS.APERTA,
    createdAt: new Date().toISOString(),
    prioritaFinoA: null,
    cedo: { shiftId, flessibile: false },
  };
  const evitaChiusura = Boolean(autore.preferenze?.evitaChiusure);

  const orario = findMatches({
    ...base,
    id: 'rapido_orario',
    tipo: TIPO_CAMBIO.ORARIO,
    cerco: { giorni: [mioCedo.data], mode: WANT_MODE.RANGE, entroLe: '', dalleOre: '', evitaChiusura },
  }, ctx);

  const liberi = giorniLiberi(autore.id, mioCedo.data, ctx.shifts);
  const off = liberi.length ? findMatches({
    ...base,
    id: 'rapido_off',
    tipo: TIPO_CAMBIO.OFF,
    cerco: { giorni: liberi, mode: WANT_MODE.ANY, evitaChiusura },
  }, ctx) : [];

  return [...orario, ...off].sort((a, b) => b.score - a.score || (b.prioritaria - a.prioritaria));
}

/** Disponibilità dichiarata settimana per settimana (cap. 20). */
function disponibileIl(user, dataISO) {
  const settimana = user.disponibilita?.[appleWeekKey(dataISO)];
  if (!settimana) return false;
  return Boolean(settimana[slotSettimana(dataISO)]);
}

// Lo slot 0 è sabato, coerente con la settimana Apple.
function slotSettimana(dataISO) {
  return (weekday(dataISO) - RULES.weekStartsOn + 7) % 7;
}

/** Transizioni di stato ammesse (cap. 14-15). */
function nextStatus(request, proposte) {
  if (request.status === STATUS.CHIUSA || request.status === STATUS.ACCORDO) return request.status;
  const attive = proposte.filter((p) => p.requestId === request.id && p.status !== 'RIFIUTATA');
  if (attive.some((p) => p.accettataDa.length >= 2)) return STATUS.ACCORDO;
  if (attive.some((p) => p.accettataDa.length === 1)) return STATUS.IN_ATTESA;
  if (attive.length > 0) return STATUS.PROPOSTA;
  return STATUS.APERTA;
}

return { satisfies, validateRequest, findMatches, turnoOfferibile, opportunitaPerMe, richiesteSulGiorno, giorniLiberi, cambioRapido, disponibileIl, slotSettimana, nextStatus };
})();

// ---- src/core/store.js
const M_store = (() => {
// Stato applicativo + persistenza locale.
// Nell'MVP i dati stanno nel browser: sostituire salva()/carica() con
// chiamate a un backend non tocca né il motore né la UI.

const { RULES, STATUS } = M_rules;
const { newId, isExpired, hasPriority, isOpen } = M_model;
const { validateRequest, nextStatus, turnoOfferibile } = M_engine;
const { monthKey, todayISO } = M_time;
const { seed } = M_seed;

const CHIAVE = 'cambio-turno:v1';

const store = {
  state: null,
  listeners: new Set(),

  init() {
    this.state = carica() || seed();
    this.scadenze();
    return this.state;
  },

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },

  commit() {
    this.scadenze();
    salva(this.state);
    this.listeners.forEach((fn) => fn(this.state));
  },

  reset() {
    localStorage.removeItem(CHIAVE);
    this.state = seed();
    this.commit();
  },

  // --- lettura -------------------------------------------------------
  get me() {
    return this.state.users.find((u) => u.id === this.state.currentUserId);
  },
  user(id) {
    return this.state.users.find((u) => u.id === id);
  },
  shift(id) {
    return this.state.shifts.find((s) => s.id === id);
  },
  shiftsById() {
    return Object.fromEntries(this.state.shifts.map((s) => [s.id, s]));
  },
  shiftsOf(userId, { soloFuturi = false } = {}) {
    const oggi = todayISO();
    return this.state.shifts
      .filter((s) => s.userId === userId && (!soloFuturi || s.data >= oggi))
      .sort((a, b) => a.data.localeCompare(b.data));
  },
  request(id) {
    return this.state.requests.find((r) => r.id === id);
  },
  bacheca() {
    return this.state.requests
      .filter(isOpen)
      .sort((a, b) => (hasPriority(b) - hasPriority(a)) || b.createdAt.localeCompare(a.createdAt));
  },
  proposteDi(requestId) {
    return this.state.proposals.filter((p) => p.requestId === requestId);
  },
  propostePerMe() {
    const me = this.state.currentUserId;
    return this.state.proposals.filter(
      (p) => (p.daUserId === me || p.aUserId === me) && p.status !== 'RIFIUTATA' && !p.cambioInserito,
    );
  },
  creditoPriorita(userId = this.state.currentUserId) {
    const u = this.user(userId);
    const usati = u.prioritaUsata?.[monthKey(todayISO())] || 0;
    return Math.max(0, RULES.priority.creditsPerMonth - usati);
  },

  // --- scrittura -----------------------------------------------------
  cambiaUtente(id) {
    this.state.currentUserId = id;
    this.commit();
  },

  salvaTurno({ id, data, tipo, start, end, userId = this.state.currentUserId }) {
    const esistente = id
      ? this.shift(id)
      : this.state.shifts.find((s) => s.userId === userId && s.data === data);
    if (esistente) {
      Object.assign(esistente, { data, tipo, start, end });
    } else {
      this.state.shifts.push({ id: newId('sh'), userId, data, tipo, start, end });
    }
    this.commit();
  },

  eliminaTurno(id) {
    const usato = this.state.requests.some((r) => r.cedo.shiftId === id && isOpen(r));
    if (usato) return 'Il turno è collegato a una richiesta aperta: cancella prima la richiesta.';
    this.state.shifts = this.state.shifts.filter((s) => s.id !== id);
    this.commit();
    return null;
  },

  creaRichiesta({ tipo, cedo, cerco, usaPriorita }) {
    const errori = validateRequest(
      { tipo, cedo, cerco, userId: this.state.currentUserId }, this.shiftsById(), this.state.shifts,
    );
    if (errori.length) return { errori };
    if (usaPriorita && this.creditoPriorita() < 1) {
      return { errori: ['Non hai crediti priorità disponibili questo mese.'] };
    }

    const me = this.me;
    const richiesta = {
      id: newId('rq'),
      userId: me.id,
      createdAt: new Date().toISOString(),
      status: STATUS.APERTA,
      prioritaFinoA: null,
      tipo,
      cedo: { shiftId: cedo.shiftId, flessibile: Boolean(cedo.flessibile) },
      cerco: { ...cerco },
    };

    if (usaPriorita) {
      const scadenza = new Date(Date.now() + RULES.priority.durationHours * 3600 * 1000);
      richiesta.prioritaFinoA = scadenza.toISOString();
      const mk = monthKey(todayISO());
      me.prioritaUsata = me.prioritaUsata || {};
      me.prioritaUsata[mk] = (me.prioritaUsata[mk] || 0) + 1;
    }

    this.state.requests.push(richiesta);
    this.commit();
    return { richiesta };
  },

  // Una richiesta pubblicata non si modifica (cap. 23): si cancella e si rifà.
  cancellaRichiesta(id) {
    const r = this.request(id);
    if (!r) return;
    r.status = STATUS.CHIUSA;
    r.chiusaIl = new Date().toISOString();
    this.state.proposals
      .filter((p) => p.requestId === id && p.status !== 'RIFIUTATA')
      .forEach((p) => { p.status = 'RIFIUTATA'; });
    this.commit();
  },

  proponiScambio({ requestId, shiftOffertoId, messaggio }) {
    const r = this.request(requestId);
    if (!r) return { errori: ['Richiesta non trovata.'] };
    const me = this.state.currentUserId;
    if (r.userId === me) return { errori: ['Non puoi proporre uno scambio a te stesso.'] };
    if (this.state.proposals.some((p) => p.requestId === requestId && p.daUserId === me && p.status !== 'RIFIUTATA')) {
      return { errori: ['Hai già una proposta aperta su questa richiesta.'] };
    }
    // Il turno offerto deve reggere davvero: la regola vale qui, non solo nel
    // modulo, così nessuna scorciatoia della UI la aggira.
    const offerto = this.shift(shiftOffertoId);
    if (!offerto || offerto.userId !== me) return { errori: ['Turno offerto non valido.'] };
    const verifica = turnoOfferibile(r, offerto, this.state.shifts, this.shiftsById());
    if (!verifica.ok) return { errori: [verifica.motivo] };

    const proposta = {
      id: newId('pr'),
      requestId,
      daUserId: me,
      aUserId: r.userId,
      shiftOffertoId,
      messaggio: messaggio || '',
      accettataDa: [me], // proporre vale già come prima accettazione
      status: 'IN_ATTESA',
      createdAt: new Date().toISOString(),
      cambioInserito: false,
    };
    this.state.proposals.push(proposta);
    this.aggiornaStato(r);
    this.notifica(r.userId, `${this.user(me).nome} ti ha proposto uno scambio.`);
    this.commit();
    return { proposta };
  },

  accetta(proposalId) {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p || p.status === 'RIFIUTATA') return;
    const me = this.state.currentUserId;
    if (!p.accettataDa.includes(me)) p.accettataDa.push(me);
    const r = this.request(p.requestId);
    if (p.accettataDa.length >= 2) {
      p.status = 'ACCORDO';
      // Le altre proposte sulla stessa richiesta decadono.
      this.state.proposals
        .filter((x) => x.requestId === p.requestId && x.id !== p.id)
        .forEach((x) => { x.status = 'RIFIUTATA'; });
      [p.daUserId, p.aUserId].forEach((u) => this.notifica(u, '🟢 Cambio concordato. Inseriscilo nell\'app ufficiale.'));
    } else {
      this.notifica(p.daUserId === me ? p.aUserId : p.daUserId, `${this.user(me).nome} ha accettato il cambio.`);
    }
    this.aggiornaStato(r);
    this.commit();
  },

  rifiuta(proposalId) {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p) return;
    p.status = 'RIFIUTATA';
    this.aggiornaStato(this.request(p.requestId));
    this.commit();
  },

  // "Cambio inserito": chiude la partita, l'app non tocca il sistema ufficiale.
  cambioInserito(proposalId) {
    const p = this.state.proposals.find((x) => x.id === proposalId);
    if (!p) return;
    p.cambioInserito = true;
    const r = this.request(p.requestId);
    if (r) {
      r.status = STATUS.CHIUSA;
      r.chiusaIl = new Date().toISOString();
    }
    this.commit();
  },

  aggiornaStato(request) {
    if (!request) return;
    request.status = nextStatus(request, this.state.proposals);
  },

  impostaDisponibilita(weekKey, slot, valore) {
    const me = this.me;
    me.disponibilita = me.disponibilita || {};
    me.disponibilita[weekKey] = me.disponibilita[weekKey] || Array(7).fill(false);
    me.disponibilita[weekKey][slot] = valore;
    this.commit();
  },

  impostaContratto(patch) {
    Object.assign(this.me, patch);
    this.commit();
  },

  impostaPreferenze(patch) {
    Object.assign(this.me.preferenze, patch);
    this.commit();
  },

  /**
   * Segnala la propria richiesta a chi ha una disponibilità compatibile ma
   * non ha pubblicato niente: non c'è una sua richiesta su cui proporre,
   * quindi l'unica cosa onesta è avvisarlo.
   */
  avvisa(userId, requestId) {
    const r = this.request(requestId);
    if (!r) return { errori: ['Richiesta non trovata.'] };
    if (r.avvisati?.includes(userId)) return { errori: ['Hai già avvisato questa persona.'] };
    r.avvisati = [...(r.avvisati || []), userId];
    this.notifica(userId, `${this.me.nome} cerca un cambio che potrebbe interessarti.`);
    this.commit();
    return { ok: true };
  },

  notifica(userId, testo) {
    this.state.notifications.unshift({
      id: newId('nt'), userId, testo, letta: false, createdAt: new Date().toISOString(),
    });
    this.state.notifications = this.state.notifications.slice(0, 100);
  },

  notifichePerMe() {
    return this.state.notifications.filter((n) => n.userId === this.state.currentUserId);
  },

  scadenze() {
    const byId = Object.fromEntries(this.state.shifts.map((s) => [s.id, s]));
    for (const r of this.state.requests) {
      if (isOpen(r) && isExpired(r, byId)) r.status = STATUS.SCADUTA;
    }
  },
};

function salva(state) {
  try {
    localStorage.setItem(CHIAVE, JSON.stringify(state));
  } catch (e) {
    console.warn('Salvataggio non riuscito', e);
  }
}

function carica() {
  try {
    const raw = localStorage.getItem(CHIAVE);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

return { store };
})();

// ---- src/ui/dom.js
const M_dom = (() => {
// Micro-helper di rendering: niente framework, la app è piccola e deve
// restare apribile da Safari senza build.

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/** Template tag: interpola con escaping, salvo valori marcati raw(). */
function html(strings, ...values) {
  return strings.reduce((out, s, i) => {
    if (i === 0) return s;
    const v = values[i - 1];
    const parte = Array.isArray(v)
      ? v.map((x) => (x && x.__raw ? x.value : esc(x))).join('')
      : (v && v.__raw ? v.value : esc(v));
    return out + parte + s;
  }, '');
}

const raw = (value) => ({ __raw: true, value });

function on(root, evento, selettore, handler) {
  root.addEventListener(evento, (e) => {
    const target = e.target.closest(selettore);
    if (target && root.contains(target)) handler(e, target);
  });
}

function toast(testo) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = testo;
  el.classList.add('visibile');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('visibile'), 2600);
}

function sheet(titolo, contenuto, { azioni = '' } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = html`
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${titolo}">
      <div class="sheet-grip"></div>
      <header class="sheet-head">
        <h2>${titolo}</h2>
        <button class="icon-btn" data-chiudi aria-label="Chiudi">✕</button>
      </header>
      <div class="sheet-body">${raw(contenuto)}</div>
      ${raw(azioni ? `<footer class="sheet-foot">${azioni}</footer>` : '')}
    </div>`;
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('aperto'));
  const chiudi = () => {
    wrap.classList.remove('aperto');
    setTimeout(() => wrap.remove(), 220);
  };
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap || e.target.closest('[data-chiudi]')) chiudi();
  });
  return { el: wrap, chiudi };
}

return { esc, html, raw, on, toast, sheet };
})();

const M_components = (() => {

function nomeUtente(u) {
  return u ? `${u.nome} ${u.cognomeIniziale}.` : '—';
}

function iniziali(u) {
  return u ? `${u.nome[0]}${u.cognomeIniziale}` : '?';
}

function badgeStato(status) {
  const m = STATUS_META[status] || { dot: '', label: status };
  return html`<span class="badge stato-${status}">${m.dot} ${m.label}</span>`;
}

/** Il blocco della richiesta: è l'unità visiva di tutta l'app. */
function coppiaCedoCerco(request, { compatto = false } = {}) {
  const cedo = store.shift(request.cedo.shiftId);
  const meta = TIPO_META[request.tipo] || TIPO_META.ORARIO;
  const giorni = request.cerco.giorni || [];

  const lato = request.tipo === TIPO_CAMBIO.ORARIO
    ? html`
      <div class="lato cerco">
        <span class="etichetta">🟢 CERCO</span>
        <strong>stesso giorno</strong>
        <span class="orario">${wantLabel(request.cerco)}</span>
      </div>`
    : html`
      <div class="lato cerco">
        <span class="etichetta">🟢 LAVORO</span>
        <strong>${giorni.map((g) => formatDay(g)).join(' o ')}</strong>
        <span class="orario">${wantLabel(request.cerco)}</span>
      </div>`;

  return html`
    <div class="coppia ${compatto ? 'compatta' : ''}">
      <div class="tipo-cambio">${meta.icona} ${meta.label}</div>
      <div class="lati">

function cardRichiesta(request, { azione = 'Vedi cambio' } = {}) {

        <span class="avatar">${iniziali(autore)}</span>

      <footer class="card-foot"><span class="link">${azione} →</span></footer>
    </article>`;
}

function cardMatch(match, opzioni = {}) {
  const u = store.user(match.userId);
  const turno = store.shift(match.shiftOffertoId);
  const verde = match.tipo === 'MATCH';
  return html`
    <article class="card match ${verde ? 'verde' : 'giallo'}">
      <header class="card-head">
        <span class="avatar">${iniziali(u)}</span>
        <div>
          <strong>${nomeUtente(u)}</strong>
          <div class="meta">${u?.ruolo} · ${u?.contratto}</div>
        </div>
        <span class="score">${match.score}%</span>
      </header>
      <div class="match-tipo">
        ${verde ? '🟢 Match' : '🟡 Potenziale'}

      </div>
      <div class="turno-offerto">
        Faresti <strong>${formatDay(turno?.data)}</strong> ·
        <strong>${match.adattato?.trasformato ? `${match.adattato.start}–${match.adattato.end}` : shiftLabel(turno)}</strong>
        ${raw(match.adattato?.trasformato ? `<span class="tag">${shiftLabel(turno)} adattato al tuo contratto</span>` : '')}
      </div>
      ${raw(opzioni.mioCedo
    ? `<div class="turno-ceduto">e ${esc(u?.nome)} prende il tuo <strong>${esc(formatDay(opzioni.mioCedo.data))}</strong> · ${esc(shiftLabel(opzioni.mioCedo))}</div>`
    : '')}
      <ul class="perche">
        ${match.reasons.map((r) => raw(`<li>${r}</li>`))}
      </ul>
      ${raw(match.avvisi.length ? `<div class="avviso">⚠️ ${match.avvisi.join(' ')}</div>` : '')}

/**
 * Cosa si può fare con un match dipende da come è nato.
 * Chi ha pubblicato una richiesta si può contattare subito; chi ha solo
 * dichiarato una disponibilità va avvisato, perché non c'è una richiesta
 * sua su cui proporre.
 */
function azioneMatch(match, { miaRichiestaId } = {}) {
  const u = store.user(match.userId);
  if (match.requestId) {
    return html`
      <button class="btn primario" data-act="proponi" data-user="${match.userId}"
              data-richiesta="${match.requestId}" data-shift="${match.shiftOffertoId}">

  if (miaRichiestaId) {
    return html`
      <button class="btn secondario" data-act="avvisa" data-user="${match.userId}" data-richiesta="${miaRichiestaId}">
        Avvisa ${u?.nome}
      </button>`;
  }
  return html`
    <button class="btn primario" data-act="pubblica-avvisa" data-user="${match.userId}"
            data-data="${match.data}" data-cambio="${match.cambio}">
      Pubblica e avvisa ${u?.nome}
    </button>`;
}

function vuoto(titolo, sottotitolo, azione = '') {
  return html`
    <div class="vuoto">
      <div class="vuoto-icona">🗓️</div>
      <strong>${titolo}</strong>
      <p>${sottotitolo}</p>
      ${raw(azione)}
    </div>`;
}

/**
 * Una richiesta altrui vista dal lato di chi può risolverla: la percentuale
 * è quanto tu sei una buona risposta per lei, non il contrario.
 */
function cardOpportunita({ richiesta, match }) {
  const u = store.user(richiesta.userId);
  const verde = match.tipo === 'MATCH';
  const mioTurno = store.shift(match.shiftOffertoId);
  const me = store.me;
  // Le due cose che contano: che turno farei io, e che turno farebbe l'altra
  // persona. Entrambi già adattati al contratto di chi li riceve.
  const suoCedo = store.shift(richiesta.cedo.shiftId);
  const perMeT = trasformaTurno(suoCedo, me);
  const perMe = { data: suoCedo?.data, orario: perMeT.trasformato ? `${perMeT.start}–${perMeT.end}` : shiftLabel(suoCedo) };
  const perLei = match.adattato?.trasformato
    ? `${match.adattato.start}–${match.adattato.end}`
    : shiftLabel(mioTurno);
  return html`
    <article class="card match ${verde ? 'verde' : 'giallo'} ${hasPriority(richiesta) ? 'prioritaria' : ''}">
      <header class="card-head">
        <span class="avatar">${iniziali(u)}</span>
        <div>
          <strong>${hasPriority(richiesta) ? '⭐ ' : ''}${nomeUtente(u)}</strong>
          <div class="meta">${u?.ruolo} · ${u?.contratto}</div>
        </div>
        <span class="score">${match.score}%</span>
      </header>
      ${raw(coppiaCedoCerco(richiesta, { compatto: true }))}
      ${raw(richiesta.cerco.note ? `<p class="nota-utente">“${esc(richiesta.cerco.note)}”</p>` : '')}
      <div class="scambio-secco">
        <div><span>Tu faresti</span><strong>${formatDay(perMe.data)} · ${perMe.orario}</strong></div>
        <div><span>${u?.nome} farebbe</span><strong>${formatDay(mioTurno?.data)} · ${perLei}</strong></div>
      </div>
      <ul class="perche">${match.reasons.map((r) => raw(`<li>${esc(r)}</li>`))}</ul>
      ${raw(match.avvisi.length ? `<div class="avviso">⚠️ ${esc(match.avvisi.join(' '))}</div>` : '')}
      <button class="btn primario" data-act="proponi" data-user="${richiesta.userId}"
              data-richiesta="${richiesta.id}" data-shift="${match.shiftOffertoId}">
        Proponi lo scambio
      </button>
    </article>`;
}

return { nomeUtente, iniziali, badgeStato, coppiaCedoCerco, cardRichiesta, cardMatch, vuoto, cardOpportunita };
})();

function calendario(params) {
  const mese = params.mese || monthKey(todayISO());
  const [anno, m] = mese.split('-').map(Number);
  const primo = new Date(Date.UTC(anno, m - 1, 1));
  const giorniNelMese = new Date(Date.UTC(anno, m, 0)).getUTCDate();
  // La griglia parte dal sabato: così ogni riga è una settimana Apple intera
  // e il vincolo "non si scambia fra settimane diverse" si vede a colpo d'occhio.
  const offset = slotSettimana(`${anno}-${String(m).padStart(2, '0')}-01`);

  const aperte = store.state.requests.filter(isOpen);
  const perGiorno = new Map();
  for (const r of aperte) {
    const cedo = store.shift(r.cedo.shiftId);
    for (const d of [cedo?.data, ...(r.cerco.giorni || [])]) {
      if (!d) continue;
      const lista = perGiorno.get(d) || [];
      lista.push(r);
      perGiorno.set(d, lista);
    }
  }

  const celle = [];
  for (let i = 0; i < offset; i += 1) celle.push('<div class="giorno vuota"></div>');
  for (let g = 1; g <= giorniNelMese; g += 1) {
    const data = `${anno}-${String(m).padStart(2, '0')}-${String(g).padStart(2, '0')}`;
    const richieste = perGiorno.get(data) || [];
    const mio = store.state.shifts.find((s) => s.userId === store.state.currentUserId && s.data === data);
    const prio = richieste.some(hasPriority);
    celle.push(html`
      <button class="giorno ${data === todayISO() ? 'oggi' : ''}"
              data-act="giorno" data-data="${data}">
        <span class="numero">${g}</span>
        <span class="mio-turno">${mio ? (mio.tipo === 'OFF' ? 'OFF' : mio.start.slice(0, 5)) : ''}</span>
        <span class="indicatori">
          ${raw(prio ? '<i class="dot prio"></i>' : '')}
          ${raw(richieste.length ? `<i class="dot"></i><small>${richieste.length}</small>` : '')}
        </span>
      </button>`);
  }

  const prev = m === 1 ? `${anno - 1}-12` : `${anno}-${String(m - 1).padStart(2, '0')}`;
  const next = m === 12 ? `${anno + 1}-01` : `${anno}-${String(m + 1).padStart(2, '0')}`;

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/calendario?mese=${prev}">‹</button>
      <h1>${MESI[m - 1]} ${anno}</h1>
      <button class="icon-btn" data-act="vai" data-to="#/calendario?mese=${next}">›</button>
    </header>
    <div class="griglia-intestazione">
      ${['S', 'D', 'L', 'M', 'M', 'G', 'V'].map((d) => raw(`<span>${d}</span>`))}
    </div>
    <div class="griglia-mese">${celle.map(raw)}</div>
    <p class="legenda">
      <i class="dot"></i> richieste sul giorno · <i class="dot prio"></i> priorità.
      Ogni riga è una settimana Apple, da sabato a venerdì.
    </p>
    <button class="btn secondario largo" data-act="vai" data-to="#/profilo">Inserisci i tuoi turni</button>`;
}

function dettaglioGiorno(data) {
  const richieste = store.state.requests.filter((r) => {
    if (!isOpen(r)) return false;
    const cedo = store.shift(r.cedo.shiftId);
    return cedo?.data === data || (r.cerco.giorni || []).includes(data);
  });
  const mio = store.state.shifts.find((s) => s.userId === store.state.currentUserId && s.data === data);

  return html`
    <div class="giorno-dettaglio">
      <p class="tuo-turno">
        Il tuo turno: <strong>${mio ? shiftLabel(mio) : 'non inserito'}</strong>
        ${raw(mio && etichettaFascia(mio) ? `<span class="tag">${etichettaFascia(mio)}</span>` : '')}
      </p>
      <h3>${richieste.length} ${richieste.length === 1 ? 'richiesta' : 'richieste'}</h3>
      ${raw(richieste.length
    ? richieste.sort((a, b) => hasPriority(b) - hasPriority(a)).map((r) => cardRichiesta(r)).join('')
    : '<p class="testo-tenue">Nessuna richiesta su questo giorno.</p>')}
    </div>`;
}

/**
 * Le prossime due settimane Apple, sabato → venerdì. È il posto unico dove
 * si inseriscono i turni e si scopre chi ha bisogno di te: prima erano tre
 * schermate diverse, e la disponibilità era una griglia di ✅ che nessuno
 * avrebbe aggiornato ogni settimana.
 */
function dueSettimane() {
  const me = store.me;
  const oggi = todayISO();
  const prima = appleWeekKey(oggi);

  // Una volta sola per tutta la griglia: il motore è lo stesso che usano i match.
  const opportunita = opportunitaPerMe(me.id, store.state);
  const perGiorno = new Map();
  for (const o of opportunita) {
    for (const g of o.giorni) {
      perGiorno.set(g, [...(perGiorno.get(g) || []), o]);
    }
  }

  return [prima, addDays(prima, 7)].map((wk) => {
    const celle = Array.from({ length: 7 }, (_, i) => {
      const data = addDays(wk, i);
      const turno = store.state.shifts.find((s) => s.userId === me.id && s.data === data);
      const mie = perGiorno.get(data) || [];
      const migliore = mie[0];
      const disponibile = disponibileIl(me, data);
      return html`
        <button class="giorno-due ${data === oggi ? 'oggi' : ''} ${data < oggi ? 'passato' : ''} ${disponibile ? 'disponibile' : ''}"
                data-act="giorno-profilo" data-data="${data}">
          <span class="dow">${GIORNI[weekday(data)]}</span>
          <span class="numero">${toDate(data).getUTCDate()}</span>
          <span class="turno">${turno ? (turno.tipo === 'OFF' ? 'OFF' : turno.start) : '—'}</span>
          ${raw(migliore ? `<span class="quota">${migliore.match.score}%</span>` : '<span class="quota vuota"></span>')}
        </button>`;
    }).join('');

    return html`
      <div class="settimana-due">
        <h3>${formatDay(wk)} → ${formatDay(addDays(wk, 6))}</h3>
        <div class="griglia-due">${raw(celle)}</div>
      </div>`;
  }).join('');
}

return { home, calendario, dettaglioGiorno, bacheca, profilo, dueSettimane, dettaglioGiornoProfilo };
