    ? 'Scegli il turno del giorno che ti serve libero. Qualcuno lo prenderà, e tu lavorerai in un giorno in cui adesso sei a casa.'
    : 'Scegli il turno di cui vuoi cambiare l\'orario. Resti nello stesso giorno.'}</p>
    ${raw(miei.length ? `<div class="lista-turni">${righe}</div>`
    : vuoto('Nessun turno inserito', 'Aggiungi prima i tuoi turni.', '<button class="btn primario" data-act="vai" data-to="#/profilo">Inserisci i turni dal Profilo</button>'))}
    ${raw(off ? `
      <label class="switch">
        <input type="checkbox" data-act="flessibile" ${draft.flessibile ? 'checked' : ''}>
        <span>Sono disponibile a lasciare anche altri turni</span>
      </label>` : '')}
    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="1">Indietro</button>
      <button class="btn primario" data-act="step" data-step="3" ${raw(draft.cedoShiftId ? '' : 'disabled')}>Continua</button>
    </div>`;
}

function passoCerco() {
  return draft.tipo === TIPO_CAMBIO.OFF ? passoCercoOff() : passoCercoOrario();
}

/** Cambio orario: si resta nel giorno, si sceglie solo l'orario. */
function passoCercoOrario() {
  const cedo = store.shift(draft.cedoShiftId);
  draft.cerco.giorni = [cedo.data];

  const modi = [
    [WANT_MODE.RANGE, 'Una fascia'],
    [WANT_MODE.SPECIFIC, 'Un orario preciso'],
  ].map(([k, label]) => html`
    <button class="chip ${draft.cerco.mode === k ? 'attivo' : ''}" data-act="modo" data-modo="${k}">${label}</button>`).join('');

  const campi = draft.cerco.mode === WANT_MODE.SPECIFIC
    ? campiOrarioPreciso(cedo.data)
    : html`
      <div class="campi-orario">
        <label>Che finisca entro <input type="time" data-campo="entroLe" value="${draft.cerco.entroLe}"></label>
        <label>Che inizi dopo <input type="time" data-campo="dalleOre" value="${draft.cerco.dalleOre}"></label>
      </div>
      <p class="testo-tenue">Basta uno dei due. È il modo in cui scrivete già in chat: "un turno che finisca prima delle 19".</p>`;

  return html`
    ${raw(barra('Che orario cerchi?', 2))}
    <div class="card riepilogo">
      <p><strong>${formatDay(cedo.data, true)}</strong> · lasci ${shiftLabel(cedo)}</p>
    </div>
    <div class="chips">${raw(modi)}</div>
    ${raw(campi)}
    <label class="switch">
      <input type="checkbox" data-act="evita-chiusura" ${raw(draft.cerco.evitaChiusura ? 'checked' : '')}>
      <span>Non voglio un turno di chiusura</span>
    </label>
    <label class="campo">
      <span>Messaggio (facoltativo)</span>
      <textarea data-campo="note" rows="2" placeholder="Es. ho la macchina dal meccanico">${draft.cerco.note}</textarea>
    </label>
    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="2">Indietro</button>
      <button class="btn primario" data-act="step" data-step="4">Continua</button>
    </div>`;
}

/** Cambio OFF: si scelgono i giorni in cui si è disposti a lavorare. */
function passoCercoOff() {
  const cedo = store.shift(draft.cedoShiftId);
  const liberi = giorniLiberi(store.state.currentUserId, cedo.data, store.state.shifts);

  const pillole = liberi.map((g) => html`
    <button class="pill ${draft.cerco.giorni.includes(g) ? 'attivo' : ''}" data-act="giorno-off" data-data="${g}">
      ${formatDay(g)}
      <em>${draft.cerco.giorni.includes(g) ? 'scelto' : 'sei a casa'}</em>
    </button>`).join('');

  const modi = [
    [WANT_MODE.ANY, 'Qualsiasi turno'],
    [WANT_MODE.RANGE, 'Una fascia'],
  ].map(([k, label]) => html`
    <button class="chip ${draft.cerco.mode === k ? 'attivo' : ''}" data-act="modo" data-modo="${k}">${label}</button>`).join('');

  return html`
    ${raw(barra('Quando lavori in cambio?', 2))}
    <div class="card riepilogo">
      <p>Vuoi libero <strong>${formatDay(cedo.data, true)}</strong>, dove hai ${shiftLabel(cedo)}.</p>
    </div>
    ${raw(liberi.length ? `
      <p class="testo-tenue">Scegli in quali dei tuoi giorni liberi sei disposto a lavorare. Più ne indichi, più è probabile trovare qualcuno.</p>
      <div class="pillole">${pillole}</div>`
    : vuoto('Nessun giorno libero', `Quella settimana lavori tutti i giorni: senza un OFF da offrire non c'è niente da scambiare. Prova un cambio orario.`))}

    ${raw(draft.cerco.giorni.length ? `
      <h3>Il turno che prenderesti</h3>
      <div class="chips">${modi}</div>
      ${draft.cerco.mode === WANT_MODE.RANGE ? `
        <div class="campi-orario">
          <label>Che finisca entro <input type="time" data-campo="entroLe" value="${draft.cerco.entroLe}"></label>
          <label>Che inizi dopo <input type="time" data-campo="dalleOre" value="${draft.cerco.dalleOre}"></label>
        </div>` : ''}
      <label class="switch">
        <input type="checkbox" data-act="evita-chiusura" ${draft.cerco.evitaChiusura ? 'checked' : ''}>
        <span>Non voglio un turno di chiusura</span>
      </label>` : '')}

    <label class="campo">
      <span>Messaggio (facoltativo)</span>
      <textarea data-campo="note" rows="2" placeholder="Es. matrimonio, non posso proprio">${draft.cerco.note}</textarea>
    </label>
    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="2">Indietro</button>
      <button class="btn primario" data-act="step" data-step="4" ${raw(draft.cerco.giorni.length ? '' : 'disabled')}>Continua</button>
    </div>`;
}

/**
 * L'orario preciso non si digita: si sceglie fra i turni che quel giorno
 * esistono davvero in store. Digitare a mano è la trappola per chi ha un
 * contratto diverso: un Part Time che copia "11:00–20:00" dal turno di un
 * Full Time sta chiedendo ore che non farebbe mai.
 */
function campiOrarioPreciso(giorno) {
  const me = store.me;
  const visti = new Set();
  const turni = store.state.shifts
    .filter((s) => s.data === giorno && s.tipo === 'WORK' && s.userId !== me.id)
    .filter((s) => {
      const chiave = `${s.start}-${s.end}`;
      if (visti.has(chiave)) return false;
      visti.add(chiave);
      return true;
    })
    .sort((a, b) => a.start.localeCompare(b.start));

  const righe = turni.map((s) => {
    const t = trasformaTurno(s, me);
    const scelto = draft.cerco.start === t.start && draft.cerco.end === t.end;
    return html`
      <button class="riga-turno ${scelto ? 'scelto' : ''}" data-act="scegli-orario"
              data-start="${t.start}" data-end="${t.end}">
        <span class="giorno-nome">${shiftLabel(s)}${raw(etichettaFascia(s) ? ` <span class="tag">${etichettaFascia(s)}</span>` : '')}</span>
        <span class="turno-valore">${t.trasformato ? `tu faresti ${t.start}–${t.end}` : 'stesso orario per te'}</span>
        <span class="chevron">${scelto ? '✓' : '›'}</span>
      </button>`;
  }).join('');

  return html`
    ${raw(turni.length ? `
      <p class="testo-tenue">Gli altri turni di quel giorno. L'orario a destra è quello che faresti tu, con il tuo contratto.</p>
      <div class="lista-turni">${righe}</div>` : '')}
    <label class="switch">
      <input type="checkbox" data-act="orario-manuale" ${raw(draft.orarioManuale ? 'checked' : '')}>
      <span>Nessuno di questi, scrivo io l'orario</span>
    </label>
    ${raw(draft.orarioManuale || !turni.length ? `
      <div class="campi-orario">
        <label>Dalle <input type="time" data-campo="start" value="${draft.cerco.start}"></label>
        <label>Alle <input type="time" data-campo="end" value="${draft.cerco.end}"></label>
      </div>
      <p class="testo-tenue">Scrivi le ore che faresti tu, non quelle del turno di chi te lo cede.</p>` : '')}`;
}

function passoRiepilogo() {
  const finto = {
    userId: store.state.currentUserId,
    tipo: draft.tipo,
    cedo: { shiftId: draft.cedoShiftId, flessibile: draft.flessibile },
    cerco: draft.cerco,
  };
  const credito = store.creditoPriorita();
  const errori = validateRequest(finto, store.shiftsById(), store.state.shifts);

  return html`
    ${raw(barra('Controlla e pubblica', 3))}
    <div class="card">
      ${raw(coppiaCedoCerco(finto))}
      ${raw(draft.cerco.note ? `<p class="nota-utente">“${draft.cerco.note}”</p>` : '')}
    </div>

    <label class="switch ${credito < 1 ? 'disabilitato' : ''}">
      <input type="checkbox" data-act="priorita" ${raw(draft.usaPriorita ? 'checked' : '')} ${raw(credito < 1 ? 'disabled' : '')}>
      <span>⭐ Usa la priorità del mese (${credito} disponibile, dura ${RULES.priority.durationHours}h)</span>
    </label>
    <p class="testo-tenue">La priorità non si può aggiungere dopo e non torna indietro se cancelli la richiesta.</p>

    ${raw(errori.length ? `<div class="errori">${errori.map((e) => `<p>⚠️ ${e}</p>`).join('')}</div>` : '')}
    ${raw(draft.errori.length ? `<div class="errori">${draft.errori.map((e) => `<p>⚠️ ${e}</p>`).join('')}</div>` : '')}

    <div class="barra-azioni">
      <button class="btn secondario" data-act="step" data-step="3">Indietro</button>
      <button class="btn primario" data-act="pubblica" ${raw(errori.length ? 'disabled' : '')}>Pubblica e cerca match</button>
    </div>
    <p class="testo-tenue">Una volta pubblicata la richiesta non si modifica: si cancella e se ne fa un'altra.</p>`;
}

function barra(titolo, passo) {
  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/home">✕</button>
      <h1>${titolo}</h1>
      <span class="passo">${passo}/3</span>
    </header>
    <div class="progresso"><i style="width:${(passo / 3) * 100}%"></i></div>`;
}

// ---------------------------------------------------------------- MATCH

function match(params) {
  const r = store.request(params.id);
  if (!r) return vuoto('Richiesta non trovata', 'Forse è stata chiusa.');
  const risultati = findMatches(r, store.state);
  const pieni = risultati.filter((m) => m.tipo === 'MATCH');
  const potenziali = risultati.filter((m) => m.tipo === 'POTENZIALE');

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="vai" data-to="#/home">‹</button>
      <h1>Possibili match</h1>
    </header>
    <div class="card riepilogo">${raw(coppiaCedoCerco(r, { compatto: true }))}</div>

    ${raw(pieni.length ? `<h2 class="titolo-gruppo">🟢 Match (${pieni.length})</h2>${pieni.map((m) => cardMatch(m, { miaRichiestaId: r.id })).join('')}` : '')}
    ${raw(potenziali.length ? `<h2 class="titolo-gruppo">🟡 Potenziali (${potenziali.length})</h2>${potenziali.map((m) => cardMatch(m, { miaRichiestaId: r.id })).join('')}` : '')}
    ${raw(risultati.length ? '' : vuoto(
    'Ancora nessuno',
    'Nessun collega ha pubblicato una richiesta compatibile né dichiarato disponibilità su quel giorno. La richiesta resta in bacheca.',
    '<button class="btn secondario" data-act="vai" data-to="#/bacheca">Vai alla bacheca</button>',
  ))}
    <p class="testo-tenue">Chi non ha dato nessun segnale di interesse non compare: l'app non manda richieste a caso.</p>`;
}

// ---------------------------------------------------- DETTAGLIO RICHIESTA

function dettaglio(params) {
  const r = store.request(params.id);
  if (!r) return vuoto('Richiesta non trovata', 'Forse è stata chiusa o è scaduta.');
  const autore = store.user(r.userId);
  const mio = r.userId === store.state.currentUserId;
  const proposte = store.proposteDi(r.id).filter((p) => p.status !== 'RIFIUTATA');
  const me = store.state.currentUserId;

  const blocchiProposte = proposte.map((p) => {
    const da = store.user(p.daUserId);
    const offerto = store.shift(p.shiftOffertoId);
    const coinvolto = p.daUserId === me || p.aUserId === me;
    const hoAccettato = p.accettataDa.includes(me);
    const accordo = p.status === 'ACCORDO';

    const azioni = accordo
      ? html`
        <div class="accordo">
          <strong>🟢 Scambio concordato</strong>
          <p>Ora effettua il cambio nell'app ufficiale dei turni. Questa app non lo fa al posto tuo.</p>
          ${raw(p.cambioInserito
    ? '<span class="tag">cambio inserito</span>'
    : `<button class="btn primario largo" data-act="cambio-inserito" data-id="${p.id}">Cambio inserito</button>`)}
        </div>`
      : coinvolto && !hoAccettato
        ? html`
          <div class="barra-azioni">
            <button class="btn primario" data-act="accetta" data-id="${p.id}">Accetta</button>
            <button class="btn secondario" data-act="rifiuta" data-id="${p.id}">Rifiuta</button>
          </div>`
        : html`<p class="testo-tenue">In attesa dell'altra accettazione (${p.accettataDa.length}/2).</p>`;

    return html`
      <article class="card proposta">
        <header class="card-head">
          <span class="avatar">${iniziali(da)}</span>
          <div><strong>${nomeUtente(da)}</strong><div class="meta">ha proposto uno scambio</div></div>
        </header>
        <p>Ti darebbe <strong>${formatDay(offerto?.data)}</strong> · ${shiftLabel(offerto)}</p>
        ${raw(p.messaggio ? `<p class="nota-utente">“${p.messaggio}”</p>` : '')}
        <div class="accettazioni">${raw(p.accettataDa.map((u) => `<span class="tag ok">${nomeUtente(store.user(u))} ha accettato</span>`).join(''))}</div>
        ${raw(azioni)}
      </article>`;
  }).join('');

  const hoGiaProposto = proposte.some((p) => p.daUserId === me);
  const accordoRaggiunto = r.status === STATUS.ACCORDO || r.status === STATUS.CHIUSA;
  const azioneAutore = mio
    ? (accordoRaggiunto ? '' : html`
      <div class="barra-azioni">
        <button class="btn secondario" data-act="vai" data-to="#/match?id=${r.id}">Rivedi i match</button>
        <button class="btn pericolo" data-act="cancella" data-id="${r.id}">Cancella richiesta</button>
      </div>`)
    : r.status === STATUS.ACCORDO || r.status === STATUS.CHIUSA || hoGiaProposto || !turniOfferibili(r).length
      ? ''
      : html`<button class="btn primario largo" data-act="proponi" data-user="${r.userId}" data-richiesta="${r.id}" data-shift="">Proponi uno scambio</button>`;

  return html`
    <header class="testata">
      <button class="icon-btn" data-act="indietro">‹</button>
      <h1>Cambio turno</h1>
    </header>
    <article class="card ${hasPriority(r) ? 'prioritaria' : ''}">
      <header class="card-head">
        <span class="avatar">${iniziali(autore)}</span>
        <div>
          <strong>${hasPriority(r) ? '⭐ ' : ''}${nomeUtente(autore)}</strong>
          <div class="meta">${autore.ruolo} · ${RULES.contracts[autore.contratto].label}</div>
        </div>
      </header>
      ${raw(coppiaCedoCerco(r))}
      ${raw(r.cerco.note ? `<p class="nota-utente">“${r.cerco.note}”</p>` : '')}
      <div class="meta">${raw(badgeStato(r.status))} · pubblicata ${formatDay(r.createdAt.slice(0, 10))}</div>
    </article>
    ${raw(blocchiProposte)}
    ${raw(azioneAutore)}`;
}

/** Perché non posso rispondere: il motore lo sa, tanto vale dirlo. */
function motivoNonOfferibile(request) {
  const byId = store.shiftsById();
  const miei = store.shiftsOf(store.state.currentUserId, { soloFuturi: true });
  const motivi = miei
    .map((s) => turnoOfferibile(request, s, store.state.shifts, byId))
    .filter((v) => !v.ok)
    .map((v) => v.motivo);
  return motivi.length
    ? [...new Set(motivi)][0]
    : 'Aggiorna i tuoi turni se il calendario non è allineato.';
}

/** I turni che posso davvero offrire su una richiesta. */
function turniOfferibili(request) {
  const byId = store.shiftsById();
  return store.shiftsOf(store.state.currentUserId, { soloFuturi: true })
    .filter((s) => turnoOfferibile(request, s, store.state.shifts, byId).ok);
}

/** Contenuto della sheet "proponi scambio". */
function formProposta(request, shiftSuggerito) {
  // Si può offrire solo qualcosa che soddisfa davvero il CERCO: se cercano
  // un OFF, un turno lavorato non serve a niente.
  const opzioni = turniOfferibili(request);

  if (!opzioni.length) {
    return html`
      <div class="card">${raw(coppiaCedoCerco(request, { compatto: true }))}</div>
      <p class="avviso">⚠️ Non hai niente da offrire su questo cambio.</p>
      <p class="testo-tenue">${motivoNonOfferibile(request)}</p>`;
  }

  return html`
    <p>Stai proponendo uno scambio a <strong>${nomeUtente(store.user(request.userId))}</strong>.</p>
    <div class="card">${raw(coppiaCedoCerco(request, { compatto: true }))}</div>
    <label class="campo">
      <span>Il turno che offri</span>
      <select class="select" data-campo="shift">
        ${opzioni.map((s) => {
    const t = trasformaTurno(s, store.user(request.userId));
    const etichetta = t.trasformato
      ? `${formatDay(s.data)} · ${shiftLabel(s)} → farebbe ${t.start}–${t.end}`
      : `${formatDay(s.data)} · ${shiftLabel(s)}`;
    return raw(`<option value="${s.id}" ${s.id === shiftSuggerito ? 'selected' : ''}>${etichetta}</option>`);
  })}
      </select>
    </label>
    ${raw(opzioni.some((s) => trasformaTurno(s, store.user(request.userId)).trasformato)
    ? `<p class="testo-tenue">Il contratto di ${nomeUtente(store.user(request.userId))} è diverso dal tuo: il turno si adatta, e l'orario dopo la freccia è quello che farebbe davvero.</p>`
    : '')}
    <label class="campo">
      <span>Messaggio (facoltativo)</span>
      <textarea data-campo="messaggio" rows="2" placeholder="Es. per me va bene anche 12–20"></textarea>
    </label>
    <p class="testo-tenue">Proponendo accetti già da parte tua: serve anche l'accettazione dell'altra persona.</p>`;
}

function pubblica() {
  const { errori, richiesta } = store.creaRichiesta({
    tipo: draft.tipo,
    cedo: { shiftId: draft.cedoShiftId, flessibile: draft.flessibile },
    cerco: draft.cerco,
    usaPriorita: draft.usaPriorita,
  });
  if (errori) {
    draft.errori = errori;
    return null;
  }
  // La bozza ha finito il suo lavoro: se si torna qui si riparte da capo,
  // non dal riepilogo di una richiesta già pubblicata.
  resetDraft();
  toast('Richiesta pubblicata');
  return richiesta;
}

return { draft, resetDraft, rapido, vistaRapida, scelta, nuovo, match, dettaglio, turniOfferibili, formProposta, pubblica };
})();

// ---- src/ui/app.js
const M_app = (() => {
const { html, raw, on, toast, sheet } = M_dom;
const { store } = M_store;
const V = M_views;
const F = M_flows;
const { formatDay, appleWeekKey } = M_time;
const { slotSettimana } = M_engine;
const { durataOre, isNotturno, fuoriFascia, etichettaFascia } = M_model;
const { RULES } = M_rules;

const app = document.getElementById('app');
const tabbar = document.getElementById('tabbar');

const TABS = [
  { hash: '#/home', icona: '⌂', label: 'Home' },
  { hash: '#/calendario', icona: '▦', label: 'Calendario' },
  { hash: '#/bacheca', icona: '☰', label: 'Bacheca' },
  { hash: '#/profilo', icona: '☺', label: 'Profilo' },
];

function parseHash() {
  const h = location.hash || '#/home';
  const [percorso, query] = h.slice(2).split('?');
  const params = Object.fromEntries(new URLSearchParams(query || ''));
  return { percorso: percorso || 'home', params };
}

function render() {
  const { percorso, params } = parseHash();
  const viste = {
    home: V.home,
    calendario: V.calendario,
    bacheca: V.bacheca,
    profilo: V.profilo,
    rapido: F.vistaRapida,
    nuovo: F.nuovo,
    match: F.match,
    richiesta: F.dettaglio,
  };
  const vista = viste[percorso] || V.home;
  app.innerHTML = vista(params);
  app.scrollTop = 0;

  const attivo = TABS.find((t) => t.hash === `#/${percorso}`);
  tabbar.innerHTML = TABS.map((t) => html`
    <button class="tab ${t === attivo ? 'attivo' : ''}" data-act="vai" data-to="${t.hash}">
      <span class="tab-icona">${t.icona}</span><span>${t.label}</span>
    </button>`).join('');
  tabbar.hidden = !attivo;
}

/** La sheet del giorno nel profilo, riapribile dopo aver salvato un turno. */
function apriGiornoProfilo(data) {
  document.querySelectorAll('.sheet-backdrop [data-chiudi]').forEach((b) => b.click());
  const s = sheet(formatDay(data, true), V.dettaglioGiornoProfilo(data));
  s.el.dataset.giornoProfilo = data;
}

function vai(to) {
  // Navigare dove si è già non emette hashchange: se lo stato interno è
  // cambiato (una scelta nel wizard) va ridisegnato lo stesso.
  if (location.hash === to) render();
  else location.hash = to;
}

// ------------------------------------------------------------ azioni

const AZIONI = {
  vai: (_, el) => vai(el.dataset.to),
  indietro: () => history.back(),

  'apri-richiesta': (_, el) => vai(`#/richiesta?id=${el.dataset.id}`),

  giorno: (_, el) => {
    const data = el.dataset.data;
    sheet(formatDay(data, true), V.dettaglioGiorno(data));
  },

  // Il calendario del profilo: turno, disponibilità e chi puoi aiutare.
  'giorno-profilo': (_, el) => apriGiornoProfilo(el.dataset.data),

  'toggle-disp-giorno': (e, el) => {
    const data = el.dataset.data;
    store.impostaDisponibilita(appleWeekKey(data), slotSettimana(data), e.target.checked);
    render();
  },

  'tipo-cambio': (_, el) => {
    F.resetDraft(el.dataset.tipo);
    vai('#/nuovo');
  },

  step: (_, el) => {
    F.draft.step = Number(el.dataset.step);
    F.draft.errori = [];
    render();
  },

  'rapido-turno': (_, el) => { F.rapido.shiftId = el.dataset.id; render(); },

  // Chi ha solo una disponibilità non ha una richiesta su cui proporre:
  // si avvisa, e sarà lui a rispondere.
  avvisa: (_, el) => {
    const { errori } = store.avvisa(el.dataset.user, el.dataset.richiesta);
    toast(errori ? errori[0] : `${store.user(el.dataset.user).nome} è stato avvisato`);
    render();
  },

  // Dal Cambio rapido la richiesta non esiste ancora: si crea al volo sul
  // giorno che il motore ha trovato, poi si avvisa la persona.
  'pubblica-avvisa': (_, el) => {
    const me = store.me;
    const { errori, richiesta } = store.creaRichiesta({
      cedo: { shiftId: F.rapido.shiftId, flessibile: false },
      tipo: el.dataset.cambio,
      cerco: {
        giorni: [el.dataset.data],
        mode: el.dataset.cambio === 'ORARIO' ? 'RANGE' : 'ANY',
        entroLe: '', dalleOre: '',
        evitaChiusura: Boolean(me.preferenze?.evitaChiusure),
        note: '',
      },
      usaPriorita: false,
    });
    if (errori) return toast(errori[0]);
    store.avvisa(el.dataset.user, richiesta.id);
    toast(`Richiesta pubblicata, ${store.user(el.dataset.user).nome} è stato avvisato`);
    vai(`#/richiesta?id=${richiesta.id}`);
  },

  'scegli-cedo': (_, el) => { F.draft.cedoShiftId = el.dataset.id; render(); },
  // Nel cambio OFF i giorni offerti sono più d'uno: si aggiungono e si tolgono.
  'giorno-off': (_, el) => {
    const g = el.dataset.data;
    const giorni = F.draft.cerco.giorni;
    F.draft.cerco.giorni = giorni.includes(g) ? giorni.filter((x) => x !== g) : [...giorni, g].sort();
    render();
  },
  modo: (_, el) => { F.draft.cerco.mode = el.dataset.modo; render(); },
  'scegli-orario': (_, el) => {
    F.draft.cerco.start = el.dataset.start;
    F.draft.cerco.end = el.dataset.end;
    render();
  },
  'orario-manuale': (e) => { F.draft.orarioManuale = e.target.checked; render(); },
  flessibile: (e) => { F.draft.flessibile = e.target.checked; },
  'evita-chiusura': (e) => { F.draft.cerco.evitaChiusura = e.target.checked; },
  priorita: (e) => { F.draft.usaPriorita = e.target.checked; },

  pubblica: () => {
    const r = F.pubblica();
    if (r) vai(`#/match?id=${r.id}`);
    else render();
  },

  proponi: (_, el) => {
    const richiesta = store.request(el.dataset.richiesta);
    if (!richiesta) return;
    const possibile = F.turniOfferibili(richiesta).length > 0;
    const s = sheet('Proponi lo scambio', F.formProposta(richiesta, el.dataset.shift), {
      azioni: possibile
        ? '<button class="btn primario largo" data-act="conferma-proposta">Invia proposta</button>'
        : '<button class="btn secondario largo" data-chiudi>Chiudi</button>',
    });
    s.el.dataset.richiesta = richiesta.id;
  },

  'conferma-proposta': (_, el) => {
    const wrap = el.closest('.sheet-backdrop');
    const scelta = wrap.querySelector('[data-campo="shift"]');
    if (!scelta) return toast('Non hai un turno da offrire su quel giorno');
    const shiftId = scelta.value;
    const messaggio = wrap.querySelector('[data-campo="messaggio"]').value;
    const { errori } = store.proponiScambio({ requestId: wrap.dataset.richiesta, shiftOffertoId: shiftId, messaggio });
    if (errori) return toast(errori[0]);
    wrap.querySelector('[data-chiudi]').click();
    toast('Proposta inviata');
    vai(`#/richiesta?id=${wrap.dataset.richiesta}`);
    render();
  },

  accetta: (_, el) => { store.accetta(el.dataset.id); render(); },
  rifiuta: (_, el) => { store.rifiuta(el.dataset.id); toast('Proposta rifiutata'); render(); },
  'cambio-inserito': (_, el) => { store.cambioInserito(el.dataset.id); toast('Richiesta chiusa'); vai('#/home'); },

  cancella: (_, el) => {
    if (!confirm('Cancellare la richiesta? Non si può modificare, solo rifare da capo.')) return;
    store.cancellaRichiesta(el.dataset.id);
    toast('Richiesta cancellata');
    vai('#/home');
  },

  pref: (e, el) => { store.impostaPreferenze({ [el.dataset.key]: e.target.checked }); },
  'durata-turno': (e) => { store.impostaContratto({ durataTurno: Number(e.target.value) }); render(); },
  'monte-ore': (e) => { store.impostaContratto({ oreSettimanali: Number(e.target.value) }); render(); },

  reset: () => {
    if (!confirm('Ripristinare i dati di esempio? Perdi tutto quello che hai inserito.')) return;
    store.reset();
    vai('#/home');
    render();
  },

  'spiega-priorita': () => {
    sheet('⭐ Come funziona la priorità', html`
      <ul class="elenco">
        <li>Hai <strong>1 priorità al mese</strong>, dura <strong>48 ore</strong>.</li>
        <li>La richiesta va in cima alla bacheca ed è evidenziata nel calendario.</li>
        <li>Serve a farsi vedere, non dà nessun diritto in più: nessuno è obbligato ad accettare.</li>
        <li>Si sceglie al momento della pubblicazione: non si può aggiungere dopo.</li>
        <li>Se cancelli la richiesta il credito non torna indietro.</li>
      </ul>
      <p class="testo-tenue">Credito disponibile adesso: ${store.creditoPriorita()}.</p>`);
  },

  'modifica-turno': (_, el) => {
    const data = el.dataset.data;
    const s = store.state.shifts.find((x) => x.userId === store.state.currentUserId && x.data === data);
    const usato = s && store.state.requests.some((r) => r.cedo.shiftId === s.id && r.status !== 'CHIUSA' && r.status !== 'SCADUTA');
    const w = sheet(formatDay(data, true), html`
      ${raw(usato ? '<p class="avviso">⚠️ Questo turno è collegato a una richiesta attiva.</p>' : '')}
      <div class="chips">
        <button class="chip ${!s || s.tipo === 'WORK' ? 'attivo' : ''}" data-tipo="WORK">Turno</button>
        <button class="chip ${s?.tipo === 'OFF' ? 'attivo' : ''}" data-tipo="OFF">OFF</button>
      </div>
      <div class="campi-orario" data-orari ${raw(s?.tipo === 'OFF' ? 'hidden' : '')}>
        <label>Dalle <input type="time" data-campo="start" value="${s?.start || '10:00'}"></label>
        <label>Alle <input type="time" data-campo="end" value="${s?.end || '19:00'}"></label>
      </div>
      <p class="testo-tenue" data-nota-turno></p>`, {
      azioni: `<button class="btn primario largo" data-act="salva-turno" data-data="${data}">Salva</button>
               ${s ? `<button class="btn pericolo largo" data-act="elimina-turno" data-id="${s.id}">Elimina</button>` : ''}`,
    });
    w.el.dataset.tipo = s?.tipo || 'WORK';
    w.el.querySelectorAll('[data-tipo]').forEach((btn) => btn.addEventListener('click', () => {
      w.el.dataset.tipo = btn.dataset.tipo;
      w.el.querySelectorAll('[data-tipo]').forEach((b) => b.classList.toggle('attivo', b === btn));
      w.el.querySelector('[data-orari]').hidden = btn.dataset.tipo === 'OFF';
      nota();
    }));

    // Il turno che scavalca la mezzanotte va detto subito, altrimenti sembra
    // un errore di battitura.
    const nota = () => {
      const p = w.el.querySelector('[data-nota-turno]');
      if (w.el.dataset.tipo === 'OFF') { p.textContent = ''; return; }
      const finto = {
        tipo: 'WORK',
        start: w.el.querySelector('[data-campo="start"]').value,
        end: w.el.querySelector('[data-campo="end"]').value,
      };
      if (!finto.start || !finto.end) { p.textContent = ''; return; }
      const durata = durataOre(finto).toFixed(1).replace('.0', '');
      if (isNotturno(finto)) {
        p.textContent = `Notte: finisce alle ${finto.end} del giorno dopo, ${durata} ore.`;
      } else if (fuoriFascia(finto)) {
        p.textContent = `${durata} ore, fuori dalla fascia ${RULES.store.primoIngresso}–${RULES.store.ultimaUscita}. Controlla gli orari.`;
      } else {
        p.textContent = `${durata} ore${etichettaFascia(finto) ? ` · ${etichettaFascia(finto)}` : ''}.`;
      }
    };
    w.el.querySelectorAll('[data-campo="start"], [data-campo="end"]')
      .forEach((i) => i.addEventListener('input', nota));
    nota();
  },

  'salva-turno': (_, el) => {
    const wrap = el.closest('.sheet-backdrop');
    const tipo = wrap.dataset.tipo;
    store.salvaTurno({
      data: el.dataset.data,
      tipo,
      start: tipo === 'OFF' ? null : wrap.querySelector('[data-campo="start"]').value,
      end: tipo === 'OFF' ? null : wrap.querySelector('[data-campo="end"]').value,
    });
    const giorno = document.querySelector('[data-giorno-profilo]')?.dataset.giornoProfilo;
    wrap.querySelector('[data-chiudi]').click();
    toast('Turno salvato');
    render();
    if (giorno) apriGiornoProfilo(giorno);
  },

  'elimina-turno': (_, el) => {
    const errore = store.eliminaTurno(el.dataset.id);
    if (errore) return toast(errore);
    el.closest('.sheet-backdrop').querySelector('[data-chiudi]').click();
    render();
  },
};

on(document.body, 'click', '[data-act]', (e, el) => {
  const fn = AZIONI[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(e, el);
});

on(document.body, 'change', '[data-act]', (e, el) => {
  if (el.tagName !== 'INPUT' && el.tagName !== 'SELECT') return;
  if (el.dataset.act === 'cambia-utente') {
    store.cambiaUtente(el.value);
    toast(`Ora sei ${store.me.nome}`);
    return render();
  }
  const fn = AZIONI[el.dataset.act];
  if (fn) fn(e, el);
});

// Campi liberi del wizard (orari, note): aggiornano la bozza senza rerender.
on(document.body, 'input', '[data-campo]', (e, el) => {
  const chiave = el.dataset.campo;
  if (chiave in F.draft.cerco) F.draft.cerco[chiave] = el.value;
});

window.addEventListener('hashchange', render);

store.init();
store.subscribe(() => {});
if (!location.hash) location.hash = '#/home';
render();


return {  };
})();
</script>
